      VERSION: ${{ fromJSON(needs.resolve.outputs.debs)['fluent-package'] }}
    steps:
      - name: Cache fluent-package deb
        id: cache
        uses: actions/cache@v5
        with:
          path: fluent-package-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Read the Ruby fluent-package-builder builds with
        id: upstream
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${VERSION%-*}" \
            https://github.com/fluent/fluent-package-builder.git
          RUBY="$(sed -nE "s/^ *ruby-version: *'?([0-9.]+)'?.*/\1/p" \
            fluent-package-builder/.github/actions/build-deb/action.yml | head -n1)"
          [ -n "$RUBY" ] || { echo "fluent-package-builder v${VERSION%-*} build Ruby resolution failed"; exit 1; }
          echo "ruby=$RUBY" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ruby-version: ${{ steps.upstream.outputs.ruby }}

      - name: Build fluent-package for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          DOCKER_DEFAULT_PLATFORM: linux/ppc64le
        run: |
          cd fluent-package-builder
          mkdir -p fluent-package/apt/debian-trixie-ppc64le
          echo "debian:trixie" > fluent-package/apt/debian-trixie-ppc64le/from
          rake apt:build APT_TARGETS="debian-trixie-ppc64le"
          mkdir -p ${{ github.workspace }}/fluent-package-deb
          find fluent-package/apt/repositories -name "fluent-package*.deb" \
            -exec cp {} ${{ github.workspace }}/fluent-package-deb/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fluent-package-deb
          path: fluent-package-deb/*.deb
          retention-days: 5

  build-opensearch:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs).opensearch }}
    steps:
      - name: Checkout repository (for patch file)
        uses: actions/checkout@v5

      - name: Cache OpenSearch deb
        id: cache
        uses: actions/cache@v5
        with:
          path: opensearch-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/opensearch/*') }}

      - name: Build OpenSearch ppc64le deb
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JDK="$(curl -fsS --max-time 30 "https://raw.githubusercontent.com/opensearch-project/OpenSearch/refs/tags/$VERSION/gradle/libs.versions.toml" \
            | sed -nE 's/^bundled_jdk *= *"([0-9]+)[.+].*/\1/p')"
          [ -n "$JDK" ] || { echo "OpenSearch $VERSION bundled JDK resolution failed"; exit 1; }
          mkdir -p opensearch-deb
          docker run --rm \
            -v "${{ github.workspace }}/opensearch-deb:/output" \
            -v "${{ github.workspace }}/deps/opensearch/opensearch-ppc64le-deb.patch:/patch/opensearch-ppc64le-deb.patch" \
            "eclipse-temurin:$JDK-jdk" \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends git ca-certificates
              git clone --depth 1 --branch ${{ env.VERSION }} \
                https://github.com/opensearch-project/OpenSearch.git /build/OpenSearch
              cd /build/OpenSearch
              git apply /patch/opensearch-ppc64le-deb.patch
              ./gradlew :distribution:packages:buildNoJdkPpc64leDeb \
                -Dbuild.snapshot=false -Pcrypto.standard=FIPS-140-3
              find distribution/packages -name "opensearch-min*.deb" \
                -exec cp {} /output/ \;
            '
          ls -la opensearch-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opensearch-deb
          path: opensearch-deb/*.deb
          retention-days: 5

  build-opensearch-dashboards:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs)['opensearch-dashboards'] }}
    steps:
      - name: Checkout repository (for patch file)
        uses: actions/checkout@v5

      - name: Cache OpenSearch Dashboards deb
        id: cache
        uses: actions/cache@v5
        with:
          path: opensearch-dashboards-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/opensearch-dashboards/*') }}

      - name: Build OpenSearch Dashboards ppc64le deb
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NODE="$(curl -fsS --max-time 30 "https://raw.githubusercontent.com/opensearch-project/OpenSearch-Dashboards/refs/tags/$VERSION/.nvmrc")"
          NODE="${NODE#v}"
          NODE="${NODE%%.*}"
          [ -n "$NODE" ] || { echo "OpenSearch Dashboards $VERSION Node version resolution failed"; exit 1; }
          mkdir -p opensearch-dashboards-deb
          docker run --rm \
            -v "${{ github.workspace }}/opensearch-dashboards-deb:/output" \
            -v "${{ github.workspace }}/deps/opensearch-dashboards/opensearch-dashboards-ppc64le-deb.patch:/patch/osd.patch" \
            "node:$NODE-trixie" \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                git ca-certificates ruby ruby-dev gcc make
              gem install --no-document fpm

              useradd -m -d /build builder
              mkdir -p /build/OSD
              chown -R builder:builder /build /output

              su builder -c "
                set -ex
                git clone --depth 1 --branch ${{ env.VERSION }} \
                  https://github.com/opensearch-project/OpenSearch-Dashboards.git /build/OSD
                cd /build/OSD
                git apply /patch/osd.patch

                yarn osd bootstrap
                yarn build --deb-ppc64le --skip-archives --release

                find target -name \"opensearch-dashboards*.deb\" \
                  -exec cp {} /output/ \;
              "
            '
          ls -la opensearch-dashboards-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opensearch-dashboards-deb
          path: opensearch-dashboards-deb/*.deb
          retention-days: 5

  build-grafana:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs).grafana }}
    steps:
      - name: Cache grafana deb
        id: cache
        uses: actions/cache@v5
        with:
          path: grafana-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Cross-compile the Go binary for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p grafana-deb
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -v "${{ github.workspace }}/grafana-deb:/output" \
            golang:trixie \
            bash -c '
              set -ex
              VERSION="${{ env.VERSION }}"
              TAG="v${VERSION/-/+security-}"
              git clone --depth 1 --branch "${TAG}" \
                https://github.com/grafana/grafana.git /src

              cd /src
              export CGO_ENABLED=0
              export GOOS=linux
              export GOARCH=ppc64le
              make build-go BUILD_VERSION="${VERSION}" BUILD_BRANCH="${TAG}"
              cp bin/linux/ppc64le/grafana /output/grafana
            '

      - name: Build frontend
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NODE="$(cat grafana-src/.nvmrc)"
          NODE="${NODE#v}"
          NODE="${NODE%%.*}"
          [ -n "$NODE" ] || { echo "Grafana $VERSION Node version resolution failed"; exit 1; }
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -w /src \
            -e NODE_OPTIONS=--max_old_space_size=4096 \
            -e NODE_ENV=production \
            "node:$NODE-trixie" \
            bash -c '
              set -ex
              corepack enable
              YARN_ENABLE_PROGRESS_BARS=false yarn install --immutable
              yarn run build
            '

      - name: Package with FPM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -v "${{ github.workspace }}/grafana-deb:/output" \
            -e VERSION \
            ruby:trixie \
            bash -c '
              set -ex
              gem install fpm

              mkdir -p /pkg/usr/sbin /pkg/usr/share /pkg/etc/grafana \
                       /pkg/usr/lib/systemd/system /pkg/etc/default

              cp /src/packaging/wrappers/grafana /src/packaging/wrappers/grafana-server \
                /src/packaging/wrappers/grafana-cli /pkg/usr/sbin/
              chmod 0755 /pkg/usr/sbin/grafana /pkg/usr/sbin/grafana-server /pkg/usr/sbin/grafana-cli

              mkdir -p /pkg/usr/share/grafana/bin
              cp /output/grafana /pkg/usr/share/grafana/bin/
              cp -r /src/public /pkg/usr/share/grafana/public
              cp -r /src/conf /pkg/usr/share/grafana/conf
              cp /src/LICENSE /src/NOTICE.md /pkg/usr/share/grafana/
              echo "${VERSION}" > /pkg/usr/share/grafana/VERSION

              cp /src/packaging/deb/systemd/grafana-server.service /pkg/usr/lib/systemd/system/
              cp /src/packaging/deb/default/* /pkg/etc/default/

              cp /src/conf/defaults.ini /pkg/etc/grafana/grafana.ini
              cp /src/conf/ldap.toml /pkg/etc/grafana/ldap.toml

              cd /pkg
              fpm \
                --input-type dir \
                --output-type deb \
                --name grafana \
                --version "${VERSION}" \
                --architecture ppc64el \
                --vendor "Grafana Labs" \
                --url https://grafana.com \
                --maintainer contact@grafana.com \
                --description Grafana \
                --license AGPLv3 \
                --after-install /src/packaging/deb/control/postinst \
                --before-remove /src/packaging/deb/control/prerm \
                --config-files /etc/grafana \
                --config-files /etc/default/grafana-server \
                --package /output/ \
                .
            '
          ls -la grafana-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: grafana-deb
          path: grafana-deb/*.deb
          retention-days: 5

  build-rsct:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      RSCT: ${{ needs.resolve.outputs.rsct }}
      DRM: ${{ needs.resolve.outputs.drm }}
    steps:
      - name: Cache RSCT debs
        id: cache
        uses: actions/cache@v5
        with:
          path: rsct-debs
          key: ${{ github.job }}-${{ env.RSCT }}-${{ env.DRM }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Rebuild RSCT deb-src packages for Debian
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p rsct-debs
          docker run --rm \
            -v "${{ github.workspace }}/rsct-debs:/output" \
            debian:trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                build-essential fakeroot debhelper devscripts dpkg-dev ca-certificates curl binutils-powerpc64le-linux-gnu

              PPA=https://ppa.launchpadcontent.net/ibmpackages/rsct/ubuntu/pool/main
              RSCT=${{ env.RSCT }}
              DRM=${{ env.DRM }}

              mkdir -p /build && cd /build

              for pkg in rsct.core rsct.core.utils rsct.basic rsct.opt.storagerm devices.chrp.base.servicerm src; do
                dget -u "${PPA}/${pkg:0:1}/${pkg}/${pkg}_${RSCT}.dsc"
                cd ${pkg}-${RSCT%-*}/
                dpkg-buildpackage -us -uc -b -d -a ppc64el
                cd /build
              done

              dget -u "${PPA}/d/dynamicrm/dynamicrm_${DRM}.dsc"
              cd dynamicrm-${DRM%-*}/
              REVISION=${DRM##*-}
              sed -i "s/${REVISION}/${REVISION%%ubuntu*}/g" debian/changelog
              dpkg-buildpackage -us -uc -b -d -a ppc64el
              cd /build

              cp /build/*.deb /output/
            '
          ls -la rsct-debs/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rsct-debs
          path: rsct-debs/*.deb
          retention-days: 5

  publish:
    needs:
      - resolve
      - build-proxysql
      - build-grpcio
      - build-crypto-wheels
      - build-manylinux-wheel
      - build-pynacl-wheel
      - build-uwsgi-proton-wheels
      - build-py-radix-wheel
      - build-cross-compiled-wheels
      - build-numpy-wheel
      - build-pyzmq-wheel
      - build-magnum-cluster-api-wheel
      - build-lego
      - build-cadvisor
      - build-openstack-exporter
      - build-openstack-network-exporter
      - build-mtail
      - build-libvirt-exporter
      - download-opflex
      - build-fluent-package
      - build-opensearch
      - build-opensearch-dashboards
      - build-grafana
      - build-rsct
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build Pages directory
        env:
          WHEELS: ${{ needs.resolve.outputs.wheels }}
          VERSIONS: ${{ needs.resolve.outputs.versions }}
        run: |
          set -exo pipefail
          SITE=site
          mkdir -p $SITE/apt $SITE/simple $SITE/tarballs

          cp repo/kolla-ppc64le-repo-key.asc $SITE/repo-key.asc

          # --- apt repo ---
          cp artifacts/proxysql-deb/*.deb $SITE/apt/
          cp artifacts/fluent-package-deb/*.deb $SITE/apt/
          cp artifacts/opensearch-deb/*.deb $SITE/apt/
          cp artifacts/opensearch-dashboards-deb/*.deb $SITE/apt/
          cp artifacts/grafana-deb/*.deb $SITE/apt/
          cp artifacts/rsct-debs/*.deb $SITE/apt/
          cd $SITE/apt
          dpkg-scanpackages . /dev/null > Packages
          gzip -k Packages
          apt-ftparchive release . > Release
          cd ${{ github.workspace }}

          # GPG sign
          echo "${{ secrets.PPC64LE_REPO_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          gpg --batch --yes --clearsign -o $SITE/apt/InRelease $SITE/apt/Release

          # Rendered from the freshly generated Packages index so the advertised
          # versions can never drift from what the apt repo actually serves.
          BUILT="$(TZ=America/St_Johns date '+%b %-d, %Y, %-I:%M %p %Z')"
          FPR="$(gpg --show-keys --with-colons repo/kolla-ppc64le-repo-key.asc \
                 | awk -F: '/^fpr:/ {print $10; exit}' \
                 | sed -E 's/(.{4})/\1 /g; s/ $//')"
          python3 - "$SITE" "$BUILT" "$FPR" <<'PY'
          import html
          import json
          import os
          import sys

          site, built, fpr = sys.argv[1], sys.argv[2], sys.argv[3]

          ROW = ('    <tr><td><a href="apt/{deb}">{name}</a></td>'
                 '<td class="v">{ver}</td><td>{desc}</td>'
                 '<td class="sz">{size:.1f} MiB</td></tr>')
          VERSION_ROW = '    <tr><td>{name}</td><td class="v">{ver}</td></tr>'

          with open(f"{site}/apt/Packages", encoding="utf-8") as fh:
              stanzas = fh.read().strip().split("\n\n")

          rows = []
          for stanza in stanzas:
              fields = {}
              for line in stanza.splitlines():
                  if line[:1] in (" ", "\t"):   # folded continuation of Description
                      continue
                  key, _, value = line.partition(":")
                  fields[key] = value.strip()
              if "Package" not in fields:
                  continue
              rows.append((fields["Package"], ROW.format(
                  deb=html.escape(fields.get("Filename", "").removeprefix("./")),
                  name=html.escape(fields["Package"]),
                  ver=html.escape(fields.get("Version", "")),
                  desc=html.escape(fields.get("Description", "")),
                  size=int(fields.get("Size", 0)) / 1048576.0,
              )))

          versions = "\n".join(
              VERSION_ROW.format(name=html.escape(name), ver=html.escape(version))
              for name, version in json.loads(os.environ["VERSIONS"])
          )

          with open("repo/ppc64le-repo-index.html", encoding="utf-8") as fh:
              page = fh.read()
          for placeholder, value in (
              ("<!--VERSION_TABLE-->", versions),
              ("<!--PACKAGE_TABLE-->", "\n".join(row for _, row in sorted(rows))),
              ("<!--FINGERPRINT-->", html.escape(fpr)),
              ("<!--BUILT-->", html.escape(built)),
          ):
              if placeholder not in page:
                  raise SystemExit(f"{placeholder} missing from ppc64le-repo-index.html")
              page = page.replace(placeholder, value)

          with open(f"{site}/index.html", "w", encoding="utf-8") as fh:
              fh.write(page)
          PY

          # --- pip index ---
          generate_pip_index() {
            local dir=$1 whl fname sha
            {
              echo "<!DOCTYPE html><html><body>"
              for whl in "$dir"/*.whl; do
                fname="$(basename "$whl")"
                sha="$(sha256sum "$whl" | cut -d' ' -f1)"
                echo "<a href=\"${fname}#sha256=${sha}\">${fname}</a><br/>"
              done
              echo "</body></html>"
            } > "$dir/index.html"
          }

          for whl in artifacts/*/*.whl; do
            pkg_name="$(basename "$whl" | cut -d- -f1 | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')"
            mkdir -p "$SITE/simple/$pkg_name"
            cp "$whl" "$SITE/simple/$pkg_name/"
          done
          while read -r pkg_name version; do
            compgen -G "$SITE/simple/$pkg_name/*-$version-*.whl" > /dev/null \
              || { echo "No $pkg_name $version wheel was built"; exit 1; }
            generate_pip_index "$SITE/simple/$pkg_name"
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$WHEELS")

          # Root index
          echo '<!DOCTYPE html><html><body>' > $SITE/simple/index.html
          for d in "$SITE"/simple/*/; do
            name=$(basename "$d")
            echo "<a href=\"${name}/\">${name}</a><br/>" >> $SITE/simple/index.html
          done
          echo '</body></html>' >> $SITE/simple/index.html

          # --- tarballs ---
          cp artifacts/opflex-binaries-combined/*.tar.gz $SITE/tarballs/
          cp artifacts/lego-binary/* $SITE/tarballs/
          cp artifacts/cadvisor-binary/* $SITE/tarballs/
          cp artifacts/openstack-exporter-binary/* $SITE/tarballs/
          cp artifacts/openstack-network-exporter-binary/* $SITE/tarballs/
          cp artifacts/mtail-binary/* $SITE/tarballs/
          cp artifacts/libvirt-exporter-binary/* $SITE/tarballs/

          # Pages has no directory autoindex, so the landing page's tarballs/ link needs one.
          echo '<!DOCTYPE html><html><body>' > $SITE/tarballs/index.html
          for f in "$SITE"/tarballs/*; do
            name=$(basename "$f")
            [ "$name" = "index.html" ] && continue
            echo "<a href=\"${name}\">${name}</a><br/>" >> $SITE/tarballs/index.html
          done
          echo '</body></html>' >> $SITE/tarballs/index.html

          echo "=== Pages site contents ==="
          find $SITE -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ needs.resolve.outputs.versions }}
        run: |
          set -euo pipefail
          TAG="ppc64le-deps/$(TZ=America/St_Johns date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          BODY="$(jq -r 'map(join(" ")) | join(", ")' <<< "$VERSIONS")"
          mapfile -t ASSETS < <(find site/apt -name '*.deb'; find site/simple -name '*.whl'; find site/tarballs -type f ! -name index.html)

          gh release create "$TAG" \
            --title "ppc64le deps $(TZ=America/St_Johns date '+%b %-d, %Y (%Z)')" \
            --notes "$BODY" \
            "${ASSETS[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  build-telegraf:
    if: inputs.track == 'telegraf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Telegraf version
        id: resolve
        uses: ./.github/actions/upstream-release
        with:
          repository: influxdata/telegraf
          version: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Telegraf
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}/telegraf
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          RECIPE="telegraf/$(echo "$VERSION" | cut -d. -f1,2)/scratch"
          git clone --depth 1 https://github.com/influxdata/influxdata-docker.git /tmp/influxdata-docker
          git -C /tmp/influxdata-docker apply --directory="$RECIPE" "$GITHUB_WORKSPACE/images/telegraf/scratch-ppc64le.patch"
          docker buildx build --platform linux/ppc64le \
            --build-arg TELEGRAF_VERSION="$VERSION" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE:$VERSION" \
            --push "/tmp/influxdata-docker/$RECIPE"

  build-ipmi-exporter:
    if: inputs.track == 'ipmi-exporter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve ipmi_exporter version
        id: resolve
        uses: ./.github/actions/upstream-release
        with:
          repository: prometheus-community/ipmi_exporter
          version: ${{ inputs.version }}

      - name: Resolve FreeIPMI version
        id: freeipmi
        run: |
          set -euo pipefail
          FREEIPMI="$(curl -fsS --max-time 30 https://ftp.gnu.org/gnu/freeipmi/ \
            | grep -oE 'freeipmi-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
            | sort -uV | tail -1)"
          FREEIPMI="${FREEIPMI#freeipmi-}"
          FREEIPMI="${FREEIPMI%.tar.gz}"
          [ -n "$FREEIPMI" ] || { echo "FreeIPMI version resolution failed"; exit 1; }
          echo "Resolved FreeIPMI $FREEIPMI"
          echo "version=$FREEIPMI" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ipmi-exporter
        env:
          IPMI_EXPORTER_VERSION: ${{ steps.resolve.outputs.version }}
          FREEIPMI_VERSION: ${{ steps.freeipmi.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}/ipmi-exporter
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/ppc64le \
            --build-arg IPMI_EXPORTER_VERSION="$IPMI_EXPORTER_VERSION" \
            --build-arg FREEIPMI_VERSION="$FREEIPMI_VERSION" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE:v$IPMI_EXPORTER_VERSION-freeipmi$FREEIPMI_VERSION" \
            --push images/ipmi-exporter

  build-idrac-exporter:
    if: inputs.track == 'idrac-exporter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve idrac_exporter version
        id: resolve
        uses: ./.github/actions/upstream-release
        with:
          repository: mrlhansen/idrac_exporter
          version: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push idrac-exporter
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}/idrac-exporter
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/ppc64le \
            --build-arg IDRAC_EXPORTER_VERSION="$VERSION" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE:v$VERSION" \
            --push images/idrac-exporter

  build-tempo:
    if: inputs.track == 'tempo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Tempo version
        id: resolve
        uses: ./.github/actions/upstream-release
        with:
          repository: grafana/tempo
          version: ${{ inputs.version }}

      - name: Clone and patch Tempo
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git clone --depth 1 --branch "v$VERSION" https://github.com/grafana/tempo.git tempo
          git -C tempo apply "$GITHUB_WORKSPACE/images/tempo/live-store-ring-address.patch"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tempo/go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Tempo
        working-directory: tempo
        env:
          IMAGE: ghcr.io/${{ github.repository }}/tempo:${{ steps.resolve.outputs.version }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          COMPONENT=tempo GOARCH=amd64 make exe
          docker build --provenance false --platform linux/amd64 -f cmd/tempo/Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE" -t "$IMAGE" .
          docker push "$IMAGE"
