  build-smartctl-exporter:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.smartctl_exporter }}
    outputs:
      fix: ${{ steps.source.outputs.fix }}
      go: ${{ steps.source.outputs.go }}
    steps:
      - name: Checkout repository (for the descriptor patch)
        uses: actions/checkout@v5

      - name: Clone the release and apply PR 397 when it collects exactly the metrics PR 397 describes without describing them
        id: source
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}/smartctl-src:/src" \
            -v "${{ github.workspace }}/deps/smartctl-exporter/register-scsi-descriptors.patch:/patch/register-scsi-descriptors.patch:ro" \
            -e VERSION \
            golang:trixie \
            bash -c '
              set -euo pipefail
              git clone --depth 1 --branch "v$VERSION" https://github.com/prometheus-community/smartctl_exporter.git /src/smartctl_exporter
              cd /src/smartctl_exporter
              test "$(cat VERSION)" = "$VERSION" || { echo "::error title=smartctl_exporter $VERSION::Its VERSION file reads $(cat VERSION)"; exit 1; }
              go env GOVERSION > /src/go
              P=/patch/register-scsi-descriptors.patch
              undescribed() {
                LC_ALL=C comm -23 \
                  <(for F in *.go; do case "$F" in (*_test.go) continue ;; esac; sed "/) Describe(ch/,/^}/d; /^[[:space:]]*metric[A-Z][A-Za-z0-9]*[[:space:]]*=/d" "$F"; done | grep -oE "metric[A-Z][A-Za-z0-9]+" | LC_ALL=C sort -u) \
                  <(sed -n "/) Describe(ch/,/^}/p" main.go | grep -oE "metric[A-Z][A-Za-z0-9]+" | LC_ALL=C sort -u)
              }
              MISSING="$(undescribed)"
              ADDS="$(sed -nE "s/^\+[[:space:]]+ch <- (metric[A-Za-z0-9]+)\$/\1/p" "$P" | LC_ALL=C sort -u)"
              [ -n "$ADDS" ] || { echo "::error title=smartctl_exporter $VERSION::register-scsi-descriptors.patch describes no metric"; exit 1; }
              if [ -z "$MISSING" ]; then
                echo "::notice title=smartctl_exporter $VERSION::The release describes every metric it collects, so the build takes it as released"
                echo released > /src/fix
              elif [ "$MISSING" = "$ADDS" ]; then
                git apply --include=main.go "$P" || { echo "::error title=smartctl_exporter $VERSION::The release collects exactly the metrics prometheus-community/smartctl_exporter#397 describes without describing them, but its main.go hunk does not apply"; exit 1; }
                sed "s#main_test\.go#pr397_descriptors_test.go#g" "$P" | git apply --include=pr397_descriptors_test.go || { echo "::error title=smartctl_exporter $VERSION::The regression test of prometheus-community/smartctl_exporter#397 does not apply"; exit 1; }
                MISSING="$(undescribed)"
                [ -z "$MISSING" ] || { echo "::error title=smartctl_exporter $VERSION::With prometheus-community/smartctl_exporter#397 applied, it still collects $(echo $MISSING) without describing them"; exit 1; }
                echo "::notice title=smartctl_exporter $VERSION::The release collects $(echo $ADDS) without describing them, so the build applies prometheus-community/smartctl_exporter#397 with its regression test"
                echo applied > /src/fix
              else
                echo "::error title=smartctl_exporter $VERSION::The release collects $(echo $MISSING) without describing them, which is not exactly what prometheus-community/smartctl_exporter#397 describes"
                exit 1
              fi
            '
          echo "fix=$(cat smartctl-src/fix)" >> "$GITHUB_OUTPUT"
          echo "go=$(cat smartctl-src/go)" >> "$GITHUB_OUTPUT"

      - name: Cache smartctl_exporter tarballs
        id: cache
        uses: actions/cache@v5
        with:
          path: smartctl-exporter
          key: ${{ github.job }}-${{ env.VERSION }}-${{ steps.source.outputs.go }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/smartctl-exporter/*') }}

      - name: Test the source and cross-compile it for amd64 and ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p smartctl-exporter
          docker run --rm \
            -v "${{ github.workspace }}/smartctl-src/smartctl_exporter:/src" \
            -v "${{ github.workspace }}/smartctl-exporter:/output" \
            -w /src \
            -e VERSION \
            -e FIX="${{ steps.source.outputs.fix }}" \
            -e GOTOOLCHAIN=local \
            golang:trixie \
            bash -c '
              set -euxo pipefail
              make test
              case "$FIX" in
                applied) MODIFIED=true ;;
                released) MODIFIED=false ;;
              esac
              for ARCH in amd64 ppc64le; do
                case "$ARCH" in
                  amd64) LEVEL=GOAMD64=v1 ;;
                  ppc64le) LEVEL=GOPPC64=power8 ;;
                esac
                env GOOS=linux "GOARCH=$ARCH" "$LEVEL" make build tarball
                rm smartctl_exporter
                NAME="smartctl_exporter-$VERSION.linux-$ARCH"
                test "$(tar -tzf "$NAME.tar.gz" | LC_ALL=C sort)" = "$(printf "%s/\n%s/LICENSE\n%s/smartctl_exporter" "$NAME" "$NAME" "$NAME")"
                mkdir "/tmp/$ARCH"
                tar -xzf "$NAME.tar.gz" -C "/tmp/$ARCH"
                test -x "/tmp/$ARCH/$NAME/smartctl_exporter"
                cmp LICENSE "/tmp/$ARCH/$NAME/LICENSE"
                go version -m "/tmp/$ARCH/$NAME/smartctl_exporter" | tee /tmp/buildinfo
                for S in GOOS=linux "GOARCH=$ARCH" "$LEVEL" CGO_ENABLED=0 "vcs.modified=$MODIFIED"; do
                  grep -qxF "$(printf "\tbuild\t%s" "$S")" /tmp/buildinfo || { echo "smartctl_exporter $ARCH lacks build setting $S"; exit 1; }
                done
                grep -qF -- "-X github.com/prometheus/common/version.Version=$VERSION " /tmp/buildinfo || { echo "smartctl_exporter $ARCH is not stamped with version $VERSION"; exit 1; }
                mv "$NAME.tar.gz" "/output/smartctl_exporter-linux-$ARCH.tar.gz"
              done
            '
          ls -la smartctl-exporter/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: smartctl-exporter
          path: smartctl-exporter/
          retention-days: 5

  download-opflex:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    steps:
      - name: Download OpFlex binaries from fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.opflex }}
        run: |
          mkdir -p opflex-binaries
          gh release download "$TAG" --repo 77997/opflex \
            --pattern 'opflex-binaries-*.tar.gz' --dir opflex-binaries
          ls -la opflex-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opflex-binaries-combined
          path: opflex-binaries/*.tar.gz
          retention-days: 5

  build-fluent-package:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs)['fluent-package'] }}
    steps:
      - name: Cache fluent-package deb
        id: cache
        uses: actions/cache@v5
        with:
          path: fluent-package-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Read the Ruby fluent-package-builder builds with
        id: upstream
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${VERSION%-*}" \
            https://github.com/fluent/fluent-package-builder.git
          RUBY="$(sed -nE "s/^ *ruby-version: *'?([0-9.]+)'?.*/\1/p" \
            fluent-package-builder/.github/actions/build-deb/action.yml | head -n1)"
          [ -n "$RUBY" ] || { echo "fluent-package-builder v${VERSION%-*} build Ruby resolution failed"; exit 1; }
          echo "ruby=$RUBY" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ruby-version: ${{ steps.upstream.outputs.ruby }}

      - name: Build fluent-package for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          DOCKER_DEFAULT_PLATFORM: linux/ppc64le
        run: |
          cd fluent-package-builder
          mkdir -p fluent-package/apt/debian-trixie-ppc64le
          echo "debian:trixie" > fluent-package/apt/debian-trixie-ppc64le/from
          rake apt:build APT_TARGETS="debian-trixie-ppc64le"
          mkdir -p ${{ github.workspace }}/fluent-package-deb
          find fluent-package/apt/repositories -name "fluent-package*.deb" \
            -exec cp {} ${{ github.workspace }}/fluent-package-deb/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fluent-package-deb
          path: fluent-package-deb/*.deb
          retention-days: 5

  build-opensearch:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs).opensearch }}
    steps:
      - name: Checkout repository (for patch file)
        uses: actions/checkout@v5

      - name: Cache OpenSearch deb
        id: cache
        uses: actions/cache@v5
        with:
          path: opensearch-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/opensearch/*') }}

      - name: Build OpenSearch ppc64le deb
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JDK="$(curl -fsS --max-time 30 "https://raw.githubusercontent.com/opensearch-project/OpenSearch/refs/tags/$VERSION/gradle/libs.versions.toml" \
            | sed -nE 's/^bundled_jdk *= *"([0-9]+)[.+].*/\1/p')"
          [ -n "$JDK" ] || { echo "OpenSearch $VERSION bundled JDK resolution failed"; exit 1; }
          mkdir -p opensearch-deb
          docker run --rm \
            -v "${{ github.workspace }}/opensearch-deb:/output" \
            -v "${{ github.workspace }}/deps/opensearch/opensearch-ppc64le-deb.patch:/patch/opensearch-ppc64le-deb.patch" \
            "eclipse-temurin:$JDK-jdk" \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends git ca-certificates
              git clone --depth 1 --branch ${{ env.VERSION }} \
                https://github.com/opensearch-project/OpenSearch.git /build/OpenSearch
              cd /build/OpenSearch
              git apply /patch/opensearch-ppc64le-deb.patch
              ./gradlew :distribution:packages:buildNoJdkPpc64leDeb \
                -Dbuild.snapshot=false -Pcrypto.standard=FIPS-140-3
              find distribution/packages -name "opensearch-min*.deb" \
                -exec cp {} /output/ \;
            '
          ls -la opensearch-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opensearch-deb
          path: opensearch-deb/*.deb
          retention-days: 5

  build-opensearch-dashboards:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs)['opensearch-dashboards'] }}
    steps:
      - name: Checkout repository (for patch file)
        uses: actions/checkout@v5

      - name: Cache OpenSearch Dashboards deb
        id: cache
        uses: actions/cache@v5
        with:
          path: opensearch-dashboards-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/opensearch-dashboards/*') }}

      - name: Build OpenSearch Dashboards ppc64le deb
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NODE="$(curl -fsS --max-time 30 "https://raw.githubusercontent.com/opensearch-project/OpenSearch-Dashboards/refs/tags/$VERSION/.nvmrc")"
          NODE="${NODE#v}"
          NODE="${NODE%%.*}"
          [ -n "$NODE" ] || { echo "OpenSearch Dashboards $VERSION Node version resolution failed"; exit 1; }
          mkdir -p opensearch-dashboards-deb
          docker run --rm \
            -v "${{ github.workspace }}/opensearch-dashboards-deb:/output" \
            -v "${{ github.workspace }}/deps/opensearch-dashboards/opensearch-dashboards-ppc64le-deb.patch:/patch/osd.patch" \
            "node:$NODE-trixie" \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                git ca-certificates ruby ruby-dev gcc make
              gem install --no-document fpm

              useradd -m -d /build builder
              mkdir -p /build/OSD
              chown -R builder:builder /build /output

              su builder -c "
                set -ex
                git clone --depth 1 --branch ${{ env.VERSION }} \
                  https://github.com/opensearch-project/OpenSearch-Dashboards.git /build/OSD
                cd /build/OSD
                git apply /patch/osd.patch

                yarn osd bootstrap
                yarn build --deb-ppc64le --skip-archives --release

                find target -name \"opensearch-dashboards*.deb\" \
                  -exec cp {} /output/ \;
              "
            '
          ls -la opensearch-dashboards-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opensearch-dashboards-deb
          path: opensearch-dashboards-deb/*.deb
          retention-days: 5

  build-grafana:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs).grafana }}
    steps:
      - name: Cache grafana deb
        id: cache
        uses: actions/cache@v5
        with:
          path: grafana-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Cross-compile the Go binary for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p grafana-deb
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -v "${{ github.workspace }}/grafana-deb:/output" \
            golang:trixie \
            bash -c '
              set -ex
              VERSION="${{ env.VERSION }}"
              TAG="v${VERSION/-/+security-}"
              git clone --depth 1 --branch "${TAG}" \
                https://github.com/grafana/grafana.git /src

              cd /src
              export CGO_ENABLED=0
              export GOOS=linux
              export GOARCH=ppc64le
              make build-go BUILD_VERSION="${VERSION}" BUILD_BRANCH="${TAG}"
              cp bin/linux/ppc64le/grafana /output/grafana
            '

      - name: Build frontend
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NODE="$(cat grafana-src/.nvmrc)"
          NODE="${NODE#v}"
          NODE="${NODE%%.*}"
          [ -n "$NODE" ] || { echo "Grafana $VERSION Node version resolution failed"; exit 1; }
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -w /src \
            -e NODE_OPTIONS=--max_old_space_size=4096 \
            -e NODE_ENV=production \
            "node:$NODE-trixie" \
            bash -c '
              set -ex
              corepack enable
              YARN_ENABLE_PROGRESS_BARS=false yarn install --immutable
              yarn run build
            '

      - name: Package with FPM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -v "${{ github.workspace }}/grafana-deb:/output" \
            -e VERSION \
            ruby:trixie \
            bash -c '
              set -ex
              gem install fpm

              mkdir -p /pkg/usr/sbin /pkg/usr/share /pkg/etc/grafana \
                       /pkg/usr/lib/systemd/system /pkg/etc/default

              cp /src/packaging/wrappers/grafana /src/packaging/wrappers/grafana-server \
                /src/packaging/wrappers/grafana-cli /pkg/usr/sbin/
              chmod 0755 /pkg/usr/sbin/grafana /pkg/usr/sbin/grafana-server /pkg/usr/sbin/grafana-cli

              mkdir -p /pkg/usr/share/grafana/bin
              cp /output/grafana /pkg/usr/share/grafana/bin/
              cp -r /src/public /pkg/usr/share/grafana/public
              cp -r /src/conf /pkg/usr/share/grafana/conf
              cp /src/LICENSE /src/NOTICE.md /pkg/usr/share/grafana/
              echo "${VERSION}" > /pkg/usr/share/grafana/VERSION

              cp /src/packaging/deb/systemd/grafana-server.service /pkg/usr/lib/systemd/system/
              cp /src/packaging/deb/default/* /pkg/etc/default/

              cp /src/conf/defaults.ini /pkg/etc/grafana/grafana.ini
              cp /src/conf/ldap.toml /pkg/etc/grafana/ldap.toml

              cd /pkg
              fpm \
                --input-type dir \
                --output-type deb \
                --name grafana \
                --version "${VERSION}" \
                --architecture ppc64el \
                --vendor "Grafana Labs" \
                --url https://grafana.com \
                --maintainer contact@grafana.com \
                --description Grafana \
                --license AGPLv3 \
                --after-install /src/packaging/deb/control/postinst \
                --before-remove /src/packaging/deb/control/prerm \
                --config-files /etc/grafana \
                --config-files /etc/default/grafana-server \
                --package /output/ \
                .
            '
          ls -la grafana-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: grafana-deb
          path: grafana-deb/*.deb
          retention-days: 5

  build-grafana-plugins:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      PLUGINS: ${{ needs.resolve.outputs.grafana_plugins }}
    steps:
      - name: Checkout repository (for the mage target)
        uses: actions/checkout@v5

      - name: Name the plugin builds
        id: versions
        run: |
          set -euo pipefail
          echo "key=$(jq -r 'map("\(.id)-\(.version)-\(.commit)") | join("-")' <<< "$PLUGINS")" >> "$GITHUB_OUTPUT"

      - name: Cache Grafana plugins
        id: cache
        uses: actions/cache@v5
        with:
          path: grafana-plugins
          key: ${{ github.job }}-${{ steps.versions.outputs.key }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/grafana-plugins/*') }}

      - name: Clone the plugins at their catalogue commits
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          jq -r '.[] | "\(.id) \(.repository) \(.version) \(.commit)"' <<< "$PLUGINS" | while read -r ID REPOSITORY VERSION COMMIT; do
            docker run --rm \
              -v "${{ github.workspace }}/plugin-src:/src" \
              golang:trixie \
              bash -c '
                set -e
                git clone --depth 1 --branch "v$1" "https://github.com/$2.git" "/src/$3"
                test "$(git -C "/src/$3" rev-parse HEAD)" = "$4" || { echo "$2 v$1 is not the catalogue build $4"; exit 1; }
              ' _ "$VERSION" "$REPOSITORY" "$ID" "$COMMIT"
          done

      - name: Build the frontends
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for ID in $(jq -r '.[].id' <<< "$PLUGINS"); do
            NODE="$(cat "plugin-src/$ID/.nvmrc")"
            NODE="${NODE#v}"
            NODE="${NODE%%.*}"
            [ -n "$NODE" ] || { echo "$ID Node version resolution failed"; exit 1; }
            docker run --rm \
              -v "${{ github.workspace }}/plugin-src/$ID:/src" \
              -w /src \
              "node:$NODE-trixie" \
              bash -c '
                set -ex
                PM="$(node -p "require(\"./package.json\").packageManager")"
                case "$PM" in npm@*) ;; *) echo "packageManager is $PM, not npm"; exit 1 ;; esac
                npm install -g "${PM%%+*}"
                npm ci
                npm run build
              '
          done

      - name: Cross-compile the backends for ppc64le and package the plugins
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p grafana-plugins
          docker run --rm \
            -v "${{ github.workspace }}/plugin-src:/src" \
            -v "${{ github.workspace }}/deps/grafana-plugins/ppc64le_mage.go:/mage/ppc64le_mage.go:ro" \
            -v "${{ github.workspace }}/grafana-plugins:/output" \
            -e IDS="$(jq -r 'map(.id) | join(" ")' <<< "$PLUGINS")" \
            golang:trixie \
            bash -c '
              set -exo pipefail
              mkdir -p /tmp/grafana-plugins
              for ID in $IDS; do
                cd "/src/$ID"
                cp /mage/ppc64le_mage.go .
                go run github.com/magefile/mage -v linuxppc64le
                set -- dist/*_linux_ppc64le
                test "$#" -eq 1
                test -x "$1"
                test ! -e dist/MANIFEST.txt
                go version -m "$1" | tee /tmp/buildinfo
                for S in GOOS=linux GOARCH=ppc64le GOPPC64=power8 CGO_ENABLED=0; do
                  grep -qxF "$(printf "\tbuild\t%s" "$S")" /tmp/buildinfo || { echo "$ID backend lacks build setting $S"; exit 1; }
                done
                cp -a dist "/tmp/grafana-plugins/$ID"
              done
              tar -czf /output/grafana-plugins-ppc64le.tar.gz --owner=0 --group=0 --numeric-owner -C /tmp/grafana-plugins $IDS
            '
          ls -la grafana-plugins/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: grafana-plugins
          path: grafana-plugins/
          retention-days: 5

  build-rsct:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      RSCT: ${{ needs.resolve.outputs.rsct }}
      DRM: ${{ needs.resolve.outputs.drm }}
    steps:
      - name: Cache RSCT debs
        id: cache
        uses: actions/cache@v5
        with:
          path: rsct-debs
          key: ${{ github.job }}-${{ env.RSCT }}-${{ env.DRM }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Rebuild RSCT deb-src packages for Debian
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p rsct-debs
          docker run --rm \
            -v "${{ github.workspace }}/rsct-debs:/output" \
            debian:trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                build-essential fakeroot debhelper devscripts dpkg-dev ca-certificates curl binutils-powerpc64le-linux-gnu

              PPA=https://ppa.launchpadcontent.net/ibmpackages/rsct/ubuntu/pool/main
              RSCT=${{ env.RSCT }}
              DRM=${{ env.DRM }}

              mkdir -p /build && cd /build

              for pkg in rsct.core rsct.core.utils rsct.basic rsct.opt.storagerm devices.chrp.base.servicerm src; do
                dget -u "${PPA}/${pkg:0:1}/${pkg}/${pkg}_${RSCT}.dsc"
                cd ${pkg}-${RSCT%-*}/
                dpkg-buildpackage -us -uc -b -d -a ppc64el
                cd /build
              done

              dget -u "${PPA}/d/dynamicrm/dynamicrm_${DRM}.dsc"
              cd dynamicrm-${DRM%-*}/
              REVISION=${DRM##*-}
              sed -i "s/${REVISION}/${REVISION%%ubuntu*}/g" debian/changelog
              dpkg-buildpackage -us -uc -b -d -a ppc64el
              cd /build

              cp /build/*.deb /output/
            '
          ls -la rsct-debs/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rsct-debs
          path: rsct-debs/*.deb
          retention-days: 5

  build-opal-prd:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      # Debian ships skiboot 7.0+dfsg-1 in every suite, whose opal-prd tests fork()'s result the wrong way round in
      # hservice_memory_error, so the daemon itself offlines the memory and exits, and systemd stops restarting it.
      # No skiboot release carries the upstream fixes, so the build adds them to Debian's source as quilt patches.
      # The version sorts above Debian's 7.0+dfsg-1+b2 and below any 7.0+dfsg-1.1 or 7.0+dfsg-2, so a Debian fix
      # supersedes it.
      SOURCE_VERSION: 7.0+dfsg-1
      DSC_SHA256: c5597fb51d9c24a812a5ee3d472d588fea4c287c31d0b314ee653ce57de0a683
      VERSION: 7.0+dfsg-1.1~as30265.1
    steps:
      - name: Checkout repository (for the patches and the changelog entry)
        uses: actions/checkout@v5

      - name: Cache opal-prd deb
        id: cache
        uses: actions/cache@v5
        with:
          path: opal-prd-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/opal-prd/*') }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build opal-prd for ppc64el from Debian's skiboot with the upstream fixes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p opal-prd-deb
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/opal-prd-deb:/output" \
            -v "${{ github.workspace }}/deps/opal-prd:/deps:ro" \
            -e SOURCE_VERSION -e DSC_SHA256 -e VERSION \
            debian:trixie \
            bash -c '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends build-essential ca-certificates curl dpkg-dev

              # The pinned checksum fixes the .dsc, and dpkg-source checks both tarballs against it.
              mkdir /build && cd /build
              POOL=https://deb.debian.org/debian/pool/main/s/skiboot
              for F in "skiboot_${SOURCE_VERSION}.dsc" "skiboot_${SOURCE_VERSION%-*}.orig.tar.xz" "skiboot_${SOURCE_VERSION}.debian.tar.xz"; do
                curl -fsSLO --max-time 300 "$POOL/$F"
              done
              echo "$DSC_SHA256  skiboot_${SOURCE_VERSION}.dsc" | sha256sum -c -
              dpkg-source --require-strong-checksums -x "skiboot_${SOURCE_VERSION}.dsc" skiboot
              cd skiboot

              # dpkg-source applies the patches with no fuzz, so a context that moved fails here.
              for P in /deps/*.patch; do
                cp "$P" debian/patches/
                basename "$P" >> debian/patches/series
              done
              dpkg-source --before-build .
              sed -n "/^int hservice_memory_error(/,/^}/p" external/opal-prd/opal-prd.c > /tmp/hservice_memory_error.c
              grep -qF "if (pid == 0)" /tmp/hservice_memory_error.c \
                || { echo "::error title=opal-prd::hservice_memory_error does not run the worker in the child, if (pid == 0)"; exit 1; }
              if grep -qF "if (pid > 0)" /tmp/hservice_memory_error.c; then
                echo "::error title=opal-prd::hservice_memory_error still runs the worker in the parent, if (pid > 0)"; exit 1
              fi

              cat /deps/changelog debian/changelog > /tmp/changelog
              mv /tmp/changelog debian/changelog
              test "$(dpkg-parsechangelog -S Version)" = "$VERSION" \
                || { echo "::error title=opal-prd::The changelog entry names $(dpkg-parsechangelog -S Version), not $VERSION"; exit 1; }
              for BOUND in "gt ${SOURCE_VERSION}+b2" "lt ${SOURCE_VERSION}.1" "lt ${SOURCE_VERSION%-*}-2"; do
                dpkg --compare-versions "$VERSION" $BOUND \
                  || { echo "::error title=opal-prd::$VERSION is not $BOUND"; exit 1; }
              done

              apt-get build-dep -y --no-install-recommends .
              dpkg-buildpackage -us -uc -b
              cd /build

              # Only opal-prd is published; opal-utils stays Debian'\''s.
              DEB="opal-prd_${VERSION}_ppc64el.deb"
              dpkg-deb -c "$DEB" | grep -qE " \./usr/sbin/opal-prd$" \
                || { echo "::error title=opal-prd::$DEB holds no usr/sbin/opal-prd"; exit 1; }
              dpkg-deb -x "$DEB" /tmp/opal-prd
              if grep -qaF "type %s: %m" /tmp/opal-prd/usr/sbin/opal-prd; then
                echo "::error title=opal-prd::usr/sbin/opal-prd still prints errno after offlining memory"; exit 1
              fi
              cp "$DEB" /output/
            '
          ls -la opal-prd-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opal-prd-deb
          path: opal-prd-deb/*.deb
          retention-days: 5

  build-apr-util:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      # trixie's apr-util 1.6.3-3+deb13u1 resolves and connects to a memcached server with APR_INET only, so
      # mod_auth_openidc in kolla's httpd image cannot reach an IPv6-only memcached. Upstream fixed it in 1.6.4, and
      # Debian's 1.6.6-1 in forky and sid carries the fix, so the build rebuilds that source unchanged for trixie, with
      # only a changelog entry added. The version sorts above trixie's 1.6.3-3+deb13u1 and below Debian's 1.6.6-1, so
      # a Debian 14 base takes Debian's package.
      SOURCE_VERSION: 1.6.6-1
      DSC_SHA256: dbbcf25bc4a32d66874cd0925b8ae1d0cf18e830930c66404c6c398bbfa2f26b
      VERSION: 1.6.6-1~as30265.1
      TRIXIE_VERSION: 1.6.3-3+deb13u1
    steps:
      - name: Checkout repository (for the changelog entry)
        uses: actions/checkout@v5

      - name: Cache apr-util debs
        id: cache
        uses: actions/cache@v5
        with:
          path: apr-util-debs
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}-${{ hashFiles('deps/apr-util/*') }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build apr-util for ppc64el from Debian's 1.6.6-1 unchanged
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p apr-util-debs
          # APR resolves either family with AI_ADDRCONFIG, which offers ::1 only to a host holding an IPv6 address other
          # than loopback or link-local, so the container gets one from a ULA network of its own.
          docker network create --ipv6 --subnet fd65:a5c3:2026::/64 apr-util-build
          docker run --rm --platform linux/ppc64le \
            --network apr-util-build \
            -v "${{ github.workspace }}/apr-util-debs:/output" \
            -v "${{ github.workspace }}/deps/apr-util:/deps:ro" \
            -e SOURCE_VERSION -e DSC_SHA256 -e VERSION -e TRIXIE_VERSION \
            debian:trixie \
            bash -c '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends build-essential ca-certificates curl dpkg-dev memcached

              # The pinned checksum fixes the .dsc, and dpkg-source checks the tarballs and the signature against it.
              mkdir /build && cd /build
              POOL=https://deb.debian.org/debian/pool/main/a/apr-util
              for F in "apr-util_${SOURCE_VERSION}.dsc" "apr-util_${SOURCE_VERSION%-*}.orig.tar.bz2" \
                       "apr-util_${SOURCE_VERSION%-*}.orig.tar.bz2.asc" "apr-util_${SOURCE_VERSION}.debian.tar.xz"; do
                curl -fsSLO --max-time 300 "$POOL/$F"
              done
              echo "$DSC_SHA256  apr-util_${SOURCE_VERSION}.dsc" | sha256sum -c -
              dpkg-source --require-strong-checksums -x "apr-util_${SOURCE_VERSION}.dsc" apr-util
              cd apr-util

              # The IPv6 fix: conn_connect resolves the server in either family and creates each socket in the
              # family of its address, and nothing in apr_memcache.c names APR_INET any more.
              grep -qF "apr_int32_t family = APR_UNSPEC;" memcache/apr_memcache.c \
                || { echo "::error title=apr-util::apr_memcache.c does not resolve with APR_UNSPEC"; exit 1; }
              grep -qF "apr_socket_create(&conn->sock, sa->family, SOCK_STREAM" memcache/apr_memcache.c \
                || { echo "::error title=apr-util::apr_memcache.c does not create the socket in the family of its address"; exit 1; }
              if grep -qw APR_INET memcache/apr_memcache.c; then
                echo "::error title=apr-util::apr_memcache.c still names APR_INET"; exit 1
              fi

              cat /deps/changelog debian/changelog > /tmp/changelog
              mv /tmp/changelog debian/changelog
              test "$(dpkg-parsechangelog -S Version)" = "$VERSION" \
                || { echo "::error title=apr-util::The changelog entry names $(dpkg-parsechangelog -S Version), not $VERSION"; exit 1; }
              for BOUND in "gt ${TRIXIE_VERSION}" "lt ${SOURCE_VERSION}"; do
                dpkg --compare-versions "$VERSION" $BOUND \
                  || { echo "::error title=apr-util::$VERSION is not $BOUND"; exit 1; }
              done

              # The test suite runs, so the rebuild is checked against trixie'\''s libraries. Its apr_memcache tests
              # run only once its own probe (check_mc) has reached memcached on localhost, and that probe resolves
              # and connects with APR_INET alone, so a memcached listens on 127.0.0.1 for the probe, and another on
              # ::1. The library resolves localhost with APR_UNSPEC, and glibc orders ::1 (precedence 50) before
              # 127.0.0.1 (35), so its tests store into the instance on ::1; a library without the IPv6 fix resolves
              # with APR_INET and would store into the instance on 127.0.0.1. The probe only asks for the version,
              # so the instance on 127.0.0.1 records no set.
              grep -qE "^::1[[:space:]](.*[[:space:]])?localhost([[:space:]]|$)" /etc/hosts \
                || { echo "::error title=apr-util::/etc/hosts does not resolve localhost to ::1"; exit 1; }
              grep -qE "^127\.0\.0\.1[[:space:]](.*[[:space:]])?localhost([[:space:]]|$)" /etc/hosts \
                || { echo "::error title=apr-util::/etc/hosts does not resolve localhost to 127.0.0.1"; exit 1; }
              memcached -u nobody -l 127.0.0.1 -p 11211 -U 0 &
              memcached -u nobody -l ::1 -p 11211 -U 0 &
              for ADDR in 127.0.0.1 ::1; do
                for I in $(seq 1 60); do
                  if (exec 3<>"/dev/tcp/$ADDR/11211") 2>/dev/null; then break; fi
                  test "$I" -lt 60 || { echo "::error title=apr-util::memcached does not listen on $ADDR port 11211"; exit 1; }
                  sleep 1
                done
              done

              apt-get build-dep -y --no-install-recommends .
              dpkg-buildpackage -us -uc -b 2>&1 | tee /tmp/build.log
              if grep -qF "Skipping apr_memcache tests" /tmp/build.log; then
                echo "::error title=apr-util::The apr_memcache tests did not reach memcached on 127.0.0.1:11211"; exit 1
              fi
              sets() {
                exec 3<>"/dev/tcp/$1/11211"
                printf "stats\r\nquit\r\n" >&3
                sed -n "s/^STAT cmd_set \([0-9]*\).*/\1/p" <&3
                exec 3<&-
              }
              SETS6="$(sets ::1)"
              SETS4="$(sets 127.0.0.1)"
              test -n "$SETS6" && test "$SETS6" -gt 0 \
                || { echo "::error title=apr-util::The apr_memcache tests stored nothing in memcached on [::1]:11211"; exit 1; }
              test "$SETS4" = 0 \
                || { echo "::error title=apr-util::The apr_memcache tests stored into memcached on 127.0.0.1:11211, not [::1]:11211"; exit 1; }
              cd /build

              # Every binary package of the source is published at one version, since each depends on
              # libaprutil1t64 (= its version) and apache2-bin needs libaprutil1-ldap and a DBD driver beside it.
              # The listing goes to a file first: grep -q stops reading at its first match, and under pipefail the
              # tar that dpkg-deb runs would die of SIGPIPE and fail the check that just matched.
              dpkg-deb -c "libaprutil1t64_${VERSION}_ppc64el.deb" > /tmp/libaprutil1t64.list
              grep -qE " \./usr/lib/powerpc64le-linux-gnu/libaprutil-1\.so\.0\.[0-9.]+$" /tmp/libaprutil1t64.list \
                || { echo "::error title=apr-util::libaprutil1t64_${VERSION}_ppc64el.deb holds no libaprutil-1.so.0"; exit 1; }
              for PKG in libaprutil1t64 libaprutil1-ldap libaprutil1-dbd-mysql libaprutil1-dbd-sqlite3 \
                         libaprutil1-dbd-odbc libaprutil1-dbd-pgsql libaprutil1-dev; do
                DEB="${PKG}_${VERSION}_ppc64el.deb"
                test -f "$DEB" || { echo "::error title=apr-util::$DEB was not built"; exit 1; }
                cp "$DEB" /output/
              done
            '
          docker network rm apr-util-build
          ls -la apr-util-debs/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: apr-util-debs
          path: apr-util-debs/*.deb
          retention-days: 5

  build-cloudflared:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.cloudflared }}
    steps:
      - name: Cache cloudflared deb
        id: cache
        uses: actions/cache@v5
        with:
          path: cloudflared-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Cross-compile the cloudflared release unchanged for ppc64le with its own Makefile and the Go its go.mod names, and package it, since Cloudflare publishes no ppc64el build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p cloudflared-deb
          docker run --rm \
            -v "${{ github.workspace }}/cloudflared-deb:/output" \
            -e VERSION \
            -e GOTOOLCHAIN=auto \
            golang:trixie \
            bash -c '
              set -euxo pipefail
              git clone --depth 1 --branch "$VERSION" https://github.com/cloudflare/cloudflared.git /src
              cd /src
              test "$(git describe --tags --exact-match)" = "$VERSION" \
                || { echo "::error title=cloudflared $VERSION::The clone is not at the release tag"; exit 1; }
              GO="go$(go list -m -f "{{.GoVersion}}")"
              env GOOS=linux GOARCH=ppc64le GOPPC64=power8 CGO_ENABLED=0 make install DESTDIR=/pkg

              BIN=/pkg/usr/bin/cloudflared
              go version -m "$BIN" | tee /tmp/buildinfo
              test "$(head -1 /tmp/buildinfo)" = "$BIN: $GO" \
                || { echo "::error title=cloudflared $VERSION::It is not built with $GO, the Go its go.mod names"; exit 1; }
              for S in GOOS=linux GOARCH=ppc64le GOPPC64=power8 CGO_ENABLED=0 vcs.modified=false "vcs.revision=$(git rev-parse HEAD)"; do
                grep -qxF "$(printf "\tbuild\t%s" "$S")" /tmp/buildinfo \
                  || { echo "::error title=cloudflared $VERSION::It lacks build setting $S"; exit 1; }
              done

              gzip -9n /pkg/usr/share/man/man1/cloudflared.1
              install -d /pkg/usr/share/doc/cloudflared /pkg/DEBIAN
              install -m 644 LICENSE /pkg/usr/share/doc/cloudflared/copyright
              DEB_VERSION="$VERSION~as30265.1"
              printf "%s\n" \
                "Package: cloudflared" \
                "Version: $DEB_VERSION" \
                "Architecture: ppc64el" \
                "Maintainer: Bear <61359476+bearnl@users.noreply.github.com>" \
                "Installed-Size: $(du -sk --exclude=DEBIAN /pkg | cut -f1)" \
                "Section: net" \
                "Priority: optional" \
                "Homepage: https://github.com/cloudflare/cloudflared" \
                "Description: Cloudflare Tunnel daemon" \
                " The cloudflared release $VERSION, built unchanged for ppc64el from its" \
                " release tag with the Makefile of its own source." \
                > /pkg/DEBIAN/control
              DEB="/output/cloudflared_${DEB_VERSION}_ppc64el.deb"
              dpkg-deb --root-owner-group --build /pkg "$DEB"

              dpkg-deb -c "$DEB" | awk "{print \$NF}" > /tmp/contents
              for F in usr/bin/cloudflared usr/share/man/man1/cloudflared.1.gz usr/share/doc/cloudflared/copyright; do
                grep -qxF "./$F" /tmp/contents \
                  || { echo "::error title=cloudflared $VERSION::$DEB holds no $F"; exit 1; }
              done
              test "$(dpkg-deb -f "$DEB" Version)" = "$DEB_VERSION"
              test "$(dpkg-deb -f "$DEB" Architecture)" = ppc64el
            '
          ls -la cloudflared-deb/

      - name: Run the packaged binary on ppc64le under QEMU and check the version it reports
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          set -- cloudflared-deb/*.deb
          [ "$#" -eq 1 ] || { echo "::error title=cloudflared $VERSION::cloudflared-deb holds $# packages"; exit 1; }
          dpkg-deb -x "$1" cloudflared-check
          OUT="$(docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/cloudflared-check:/check:ro" \
            debian:trixie /check/usr/bin/cloudflared --version)"
          echo "$OUT"
          case "$OUT" in
            "cloudflared version $VERSION (built "*) ;;
            *) echo "::error title=cloudflared $VERSION::The ppc64le binary reports: $OUT"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cloudflared-deb
          path: cloudflared-deb/*.deb
          retention-days: 5

  publish:
    needs:
      - resolve
      - build-proxysql
      - build-grpcio
      - build-crypto-wheels
      - build-manylinux-wheel
      - build-zuul-wheels
      - build-pynacl-wheel
      - build-uwsgi-proton-wheels
      - build-py-radix-wheel
      - build-cross-compiled-wheels
      - build-numpy-wheel
      - build-pyzmq-wheel
      - build-magnum-cluster-api-wheel
      - build-lego
      - build-cadvisor
      - build-openstack-exporter
      - build-openstack-network-exporter
      - build-mtail
      - build-libvirt-exporter
      - build-smartctl-exporter
      - download-opflex
      - build-fluent-package
      - build-opensearch
      - build-opensearch-dashboards
      - build-grafana
      - build-grafana-plugins
      - build-rsct
      - build-opal-prd
      - build-apr-util
      - build-cloudflared
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Install apt-ftparchive
        # The Ubuntu 26.04 runner image no longer carries apt-utils.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apt-utils

      - name: Build Pages directory
        env:
          WHEELS: ${{ needs.resolve.outputs.wheels }}
          VERSIONS: ${{ needs.resolve.outputs.versions }}
        run: |
          set -exo pipefail
          SITE=site
          mkdir -p $SITE/apt $SITE/simple $SITE/tarballs

          cp repo/kolla-ppc64le-repo-key.asc $SITE/repo-key.asc

          # --- apt repo ---
          cp artifacts/proxysql-deb/*.deb $SITE/apt/
          cp artifacts/fluent-package-deb/*.deb $SITE/apt/
          cp artifacts/opensearch-deb/*.deb $SITE/apt/
          cp artifacts/opensearch-dashboards-deb/*.deb $SITE/apt/
          cp artifacts/grafana-deb/*.deb $SITE/apt/
          cp artifacts/rsct-debs/*.deb $SITE/apt/
          cp artifacts/opal-prd-deb/*.deb $SITE/apt/
          cp artifacts/apr-util-debs/*.deb $SITE/apt/
          cp artifacts/cloudflared-deb/*.deb $SITE/apt/
          cd $SITE/apt
          dpkg-scanpackages . /dev/null > Packages
          gzip -k Packages
          apt-ftparchive release . > Release
          cd ${{ github.workspace }}

          # GPG sign
          echo "${{ secrets.PPC64LE_REPO_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          gpg --batch --yes --clearsign -o $SITE/apt/InRelease $SITE/apt/Release

          # Rendered from the freshly generated Packages index so the advertised
          # versions can never drift from what the apt repo actually serves.
          BUILT="$(TZ=America/St_Johns date '+%b %-d, %Y, %-I:%M %p %Z')"
          FPR="$(gpg --show-keys --with-colons repo/kolla-ppc64le-repo-key.asc \
                 | awk -F: '/^fpr:/ {print $10; exit}' \
                 | sed -E 's/(.{4})/\1 /g; s/ $//')"
          python3 - "$SITE" "$BUILT" "$FPR" <<'PY'
          import html
          import json
          import os
          import sys

          site, built, fpr = sys.argv[1], sys.argv[2], sys.argv[3]

          ROW = ('    <tr><td><a href="apt/{deb}">{name}</a></td>'
                 '<td class="v">{ver}</td><td>{desc}</td>'
                 '<td class="sz">{size:.1f} MiB</td></tr>')
          VERSION_ROW = '    <tr><td>{name}</td><td class="v">{ver}</td></tr>'

          with open(f"{site}/apt/Packages", encoding="utf-8") as fh:
              stanzas = fh.read().strip().split("\n\n")

          rows = []
          for stanza in stanzas:
              fields = {}
              for line in stanza.splitlines():
                  if line[:1] in (" ", "\t"):   # folded continuation of Description
                      continue
                  key, _, value = line.partition(":")
                  fields[key] = value.strip()
              if "Package" not in fields:
                  continue
              rows.append((fields["Package"], ROW.format(
                  deb=html.escape(fields.get("Filename", "").removeprefix("./")),
                  name=html.escape(fields["Package"]),
                  ver=html.escape(fields.get("Version", "")),
                  desc=html.escape(fields.get("Description", "")),
                  size=int(fields.get("Size", 0)) / 1048576.0,
              )))

          versions = "\n".join(
              VERSION_ROW.format(name=html.escape(name), ver=html.escape(version))
              for name, version in json.loads(os.environ["VERSIONS"])
          )

          with open("repo/ppc64le-repo-index.html", encoding="utf-8") as fh:
              page = fh.read()
          for placeholder, value in (
              ("<!--VERSION_TABLE-->", versions),
              ("<!--PACKAGE_TABLE-->", "\n".join(row for _, row in sorted(rows))),
              ("<!--FINGERPRINT-->", html.escape(fpr)),
              ("<!--BUILT-->", html.escape(built)),
          ):
              if placeholder not in page:
                  raise SystemExit(f"{placeholder} missing from ppc64le-repo-index.html")
              page = page.replace(placeholder, value)

          with open(f"{site}/index.html", "w", encoding="utf-8") as fh:
              fh.write(page)
          PY

          # --- pip index ---
          generate_pip_index() {
            local dir=$1 whl fname sha
            {
              echo "<!DOCTYPE html><html><body>"
              for whl in "$dir"/*.whl; do
                fname="$(basename "$whl")"
                sha="$(sha256sum "$whl" | cut -d' ' -f1)"
                echo "<a href=\"${fname}#sha256=${sha}\">${fname}</a><br/>"
              done
              echo "</body></html>"
            } > "$dir/index.html"
          }

          for whl in artifacts/*/*.whl; do
            pkg_name="$(basename "$whl" | cut -d- -f1 | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')"
            mkdir -p "$SITE/simple/$pkg_name"
            cp "$whl" "$SITE/simple/$pkg_name/"
          done
          while read -r pkg_name version; do
            compgen -G "$SITE/simple/$pkg_name/*-$version-*.whl" > /dev/null \
              || { echo "No $pkg_name $version wheel was built"; exit 1; }
            generate_pip_index "$SITE/simple/$pkg_name"
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$WHEELS")

          # Root index
          echo '<!DOCTYPE html><html><body>' > $SITE/simple/index.html
          for d in "$SITE"/simple/*/; do
            name=$(basename "$d")
            echo "<a href=\"${name}/\">${name}</a><br/>" >> $SITE/simple/index.html
          done
          echo '</body></html>' >> $SITE/simple/index.html

          # --- tarballs ---
          cp artifacts/opflex-binaries-combined/*.tar.gz $SITE/tarballs/
          cp artifacts/lego-binary/* $SITE/tarballs/
          cp artifacts/cadvisor-binary/* $SITE/tarballs/
          cp artifacts/openstack-exporter-binary/* $SITE/tarballs/
          cp artifacts/openstack-network-exporter-binary/* $SITE/tarballs/
          cp artifacts/mtail-binary/* $SITE/tarballs/
          cp artifacts/libvirt-exporter-binary/* $SITE/tarballs/
          cp artifacts/smartctl-exporter/* $SITE/tarballs/
          cp artifacts/grafana-plugins/* $SITE/tarballs/

          # Pages has no directory autoindex, so the landing page's tarballs/ link needs one.
          echo '<!DOCTYPE html><html><body>' > $SITE/tarballs/index.html
          for f in "$SITE"/tarballs/*; do
            name=$(basename "$f")
            [ "$name" = "index.html" ] && continue
            echo "<a href=\"${name}\">${name}</a><br/>" >> $SITE/tarballs/index.html
          done
          echo '</body></html>' >> $SITE/tarballs/index.html

          echo "=== Pages site contents ==="
          find $SITE -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ needs.resolve.outputs.versions }}
          SMARTCTL_EXPORTER: ${{ needs.resolve.outputs.smartctl_exporter }}
          SMARTCTL_EXPORTER_FIX: ${{ needs.build-smartctl-exporter.outputs.fix }}
          SMARTCTL_EXPORTER_GO: ${{ needs.build-smartctl-exporter.outputs.go }}
        run: |
          set -euo pipefail
          TAG="ppc64le-deps/$(TZ=America/St_Johns date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          case "$SMARTCTL_EXPORTER_FIX" in
            applied) FIX="smartctl-exporter v$SMARTCTL_EXPORTER is built with $SMARTCTL_EXPORTER_GO and prometheus-community/smartctl_exporter#397 applied." ;;
            released) FIX="smartctl-exporter v$SMARTCTL_EXPORTER is built with $SMARTCTL_EXPORTER_GO as released, since it describes every metric it collects." ;;
          esac
          BODY="$(jq -r 'map(join(" ")) | join(", ")' <<< "$VERSIONS")"$'\n\n'"$FIX"
          mapfile -t ASSETS < <(find site/apt -name '*.deb'; find site/simple -name '*.whl'; find site/tarballs -type f ! -name index.html)

          gh release create "$TAG" \
            --title "ppc64le deps $(TZ=America/St_Johns date '+%b %-d, %Y (%Z)')" \
            --notes "$BODY" \
            "${ASSETS[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  build-telegraf:
    if: inputs.track == 'telegraf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Telegraf version
        id: resolve
        uses: ./.github/actions/upstream-release
        with:
          repository: influxdata/telegraf
          version: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Telegraf
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}/telegraf
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          RECIPE="telegraf/$(echo "$VERSION" | cut -d. -f1,2)/scratch"
          git clone --depth 1 https://github.com/influxdata/influxdata-docker.git /tmp/influxdata-docker
          git -C /tmp/influxdata-docker apply --directory="$RECIPE" "$GITHUB_WORKSPACE/images/telegraf/scratch-ppc64le.patch"
          docker buildx build --platform linux/ppc64le \
            --build-arg TELEGRAF_VERSION="$VERSION" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE:$VERSION" \
            --push "/tmp/influxdata-docker/$RECIPE"

