    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels).numpy }}
    steps:
      - name: Cache numpy wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: numpy-wheel
          key: ${{ github.job }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build numpy wheel for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p numpy-wheel
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/numpy-wheel:/output" \
            quay.io/pypa/manylinux_2_28_ppc64le \
            bash -c '
              set -ex
              yum install -y openblas-devel gcc-gfortran
              PYTHON=/opt/python/${{ needs.resolve.outputs.abi }}-${{ needs.resolve.outputs.abi }}/bin/python3
              $PYTHON -m pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/tmp/wheels \
                numpy==${{ env.VERSION }}
              # Vendor libopenblas.so.0 into the wheel. No "|| cp" fallback here:
              # an unrepaired numpy wheel is the exact bug we are fixing, so a
              # repair failure must fail the build rather than republish it.
              for whl in /tmp/wheels/*.whl; do
                auditwheel repair "$whl" \
                  --plat manylinux_2_28_ppc64le \
                  --wheel-dir=/output
              done
            '
          ls -la numpy-wheel/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: numpy-wheel
          path: numpy-wheel/*.whl
          retention-days: 5

  build-pyzmq-wheel:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels).pyzmq }}
    steps:
      - name: Cache pyzmq wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: pyzmq-wheel
          key: ${{ github.job }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build pyzmq wheel for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          read -r FILENAME URL SHA256 UPLOADED < <(curl -fsS --max-time 30 "https://pypi.org/pypi/pyzmq/$VERSION/json" \
            | jq -re '[.urls[] | select(.packagetype == "sdist")] | select(length == 1) | .[0] | "\(.filename) \(.url) \(.digests.sha256) \(.upload_time_iso_8601)"')
          mkdir -p pyzmq-sdist pyzmq-wheel
          curl -fsSL --max-time 300 -o "pyzmq-sdist/$FILENAME" "$URL"
          echo "$SHA256  pyzmq-sdist/$FILENAME" | sha256sum -c
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/pyzmq-sdist:/sdist:ro" \
            -v "${{ github.workspace }}/pyzmq-wheel:/output" \
            -e SDIST="/sdist/$FILENAME" \
            -e UPLOADED="$UPLOADED" \
            debian:trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip python3-venv build-essential \
                pkg-config cmake
              python3 -m venv /tmp/bv
              /tmp/bv/bin/pip install --no-cache-dir --upgrade pip
              PIP_UPLOADED_PRIOR_TO="$UPLOADED" /tmp/bv/bin/pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/output "$SDIST"
            '
          ls -la pyzmq-wheel/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyzmq-wheel
          path: pyzmq-wheel/*.whl
          retention-days: 5

