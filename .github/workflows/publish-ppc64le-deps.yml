              cd /build/one
              # Generate ovsdb/ovs/model.go (libovsdb modelgen from the committed
              # schema.json). Must run NATIVELY, not under the ppc64le cross-env,
              # or `go run modelgen` would build for ppc64le and fail to execute.
              go generate ./...
              CGO_ENABLED=0 GOOS=linux GOARCH=ppc64le go build -trimpath -o /output/${{ env.FILE }} .
            '
          ls -la openstack-network-exporter-binary/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: openstack-network-exporter-binary
          path: openstack-network-exporter-binary/
          retention-days: 5

  build-mtail:
    needs: resolve
