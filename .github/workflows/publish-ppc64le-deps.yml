name: Publish ppc64le Dependencies

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'What to build: pages, or one image'
        type: choice
        options:
          - pages
          - telegraf
          - ipmi-exporter
          - idrac-exporter
          - tempo
        default: pages
      version:
        description: 'Image version, as 1.40.2 (empty = highest release)'
        default: ''
      opflex_release:
        description: 'OpFlex release tag (empty = latest)'
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  resolve:
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      KOLLA: 77997/kolla
      KOLLA_BRANCH: stable/2026.1
    outputs:
      python: ${{ steps.python.outputs.version }}
      abi: ${{ steps.python.outputs.abi }}
      rsct: ${{ steps.rsct.outputs.rsct }}
      drm: ${{ steps.rsct.outputs.drm }}
      opflex: ${{ steps.opflex.outputs.tag }}
      wheels: ${{ steps.kolla.outputs.wheels }}
      debs: ${{ steps.kolla.outputs.debs }}
      tarballs: ${{ steps.kolla.outputs.tarballs }}
      recipes: ${{ steps.kolla.outputs.recipes }}
      versions: ${{ steps.kolla.outputs.versions }}
      source_builds: ${{ steps.kolla.outputs.source_builds }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve the Python of debian:trixie
        id: python
        run: |
          set -euo pipefail
          FULL="$(docker run --rm debian:trixie bash -c 'apt-get update -qq && apt-cache show --no-all-versions python3' \
            | sed -nE 's/^Version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          [ -n "$FULL" ] || { echo "Python version resolution failed"; exit 1; }
          VERSION="${FULL%.*}"
          echo "Resolved Python $FULL"
          {
            echo "full=$FULL"
            echo "version=$VERSION"
            echo "abi=cp${VERSION/./}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve current RSCT + dynamicrm versions from the PPA
        id: rsct
        run: |
          set -euo pipefail
          # The ibmpackages/rsct PPA only retains the current version in pool/, so a
          # pinned .dsc 404s on every IBM update. Resolve the latest Published version
          # from the Launchpad API instead of pinning.
          latest() {
            curl -fsS --max-time 30 \
              "https://api.launchpad.net/devel/~ibmpackages/+archive/ubuntu/rsct?ws.op=getPublishedSources&source_name=$1&exact_match=true&status=Published" \
              | python3 -c "import sys,json; print('\n'.join(e['source_package_version'] for e in json.load(sys.stdin)['entries']))" \
              | sort -V | tail -1
          }
          RSCT="$(latest rsct.core)"
          DRM="$(latest dynamicrm)"
          [ -n "$RSCT" ] && [ -n "$DRM" ] || { echo "RSCT/dynamicrm version resolution failed"; exit 1; }
          echo "Resolved RSCT=$RSCT  DRM=$DRM"
          echo "rsct=$RSCT" >> "$GITHUB_OUTPUT"
          echo "drm=$DRM" >> "$GITHUB_OUTPUT"

      - name: Resolve the OpFlex release
        id: opflex
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.opflex_release }}
        run: |
          set -euo pipefail
          TAG="$(gh release view ${TAG:+"$TAG"} --repo 77997/opflex --json tagName --jq .tagName)"
          [ -n "$TAG" ] || { echo "OpFlex release resolution failed"; exit 1; }
          echo "Resolved OpFlex $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve the wheels, debs and tarballs from kolla
        id: kolla
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.full }}
          RSCT: ${{ steps.rsct.outputs.rsct }}
          DRM: ${{ steps.rsct.outputs.drm }}
          OPFLEX: ${{ steps.opflex.outputs.tag }}
          WHEELS: >-
            grpcio cryptography bcrypt pynacl uwsgi python-qpid-proton py-radix numpy pyzmq magnum-cluster-api
            pyyaml markupsafe msgpack wrapt psutil pyrsistent netifaces tornado sysv-ipc ujson pillow psycopg2
            libsass zstd lz4 ruamel-yaml-clib yappi python-ldap scrypt rcssmin rjsmin immutables zeroconf gssapi krb5
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/resolve"
          "$RUNNER_TEMP/resolve/bin/pip" install --quiet packaging pyyaml
          "$RUNNER_TEMP/resolve/bin/python" - <<'PY'
          import ast
          import hashlib
          import io
          import json
          import os
          import re
          import string
          import subprocess
          import sys
          import tarfile
          import urllib.parse

          import yaml
          from packaging.requirements import Requirement
          from packaging.tags import cpython_tags
          from packaging.utils import canonicalize_name, parse_wheel_filename

          KOLLA = f"https://raw.githubusercontent.com/{os.environ['KOLLA']}/refs/heads/{os.environ['KOLLA_BRANCH']}/"
          DEBS = {
              "proxysql": ("proxysql", "proxysql"),
              "fluent-package": ("fluentd", "fluent-package"),
              "opensearch": ("opensearch", "opensearch"),
              "opensearch-dashboards": ("opensearch-dashboards", "opensearch-dashboards"),
              "grafana": ("grafana", "grafana"),
          }
          TARBALLS = {
              "lego": "letsencrypt-lego",
              "cadvisor": "prometheus-cadvisor",
              "openstack-exporter": "prometheus-openstack-exporter",
              "openstack-network-exporter": "prometheus-openstack-network-exporter",
              "mtail": "prometheus-mtail",
              "libvirt-exporter": "prometheus-libvirt-exporter",
          }


          def fetch(url):
              return subprocess.run(["curl", "-fsSL", "--max-time", "120", url], capture_output=True, check=True).stdout


          def literal(source, name):
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in node.targets):
                      return ast.literal_eval(node.value)
              sys.exit(f"kolla assigns no {name}")


          def newest(versions):
              if not versions:
                  sys.exit("no version to choose from")
              return subprocess.run(["sort", "-V"], input="\n".join(versions), capture_output=True, text=True, check=True).stdout.split()[-1]


          sources = literal(fetch(KOLLA + "kolla/common/sources.py"), "SOURCES")
          config = fetch(KOLLA + "kolla/common/config.py")
          release = literal(config, "OPENSTACK_RELEASE")
          requirements = string.Template(sources["openstack-base"]["location"]).substitute(
              tarballs_base=literal(config, "TARBALLS_BASE"),
              openstack_branch=release if release == "master" else f"stable-{release}",
          )
          with tarfile.open(fileobj=io.BytesIO(fetch(requirements))) as archive:
              members = [m for m in archive.getmembers() if m.name.count("/") == 1 and m.name.endswith("/upper-constraints.txt")]
              if len(members) != 1:
                  sys.exit(f"{requirements} holds {len(members)} top-level upper-constraints.txt")
              constraints = archive.extractfile(members[0]).read().decode().splitlines()

          python = os.environ["PYTHON_VERSION"]
          environment = {"python_version": ".".join(python.split(".")[:2]), "python_full_version": python, "platform_machine": "ppc64le"}
          names = os.environ["WHEELS"].split()
          pins = {}
          for line in filter(None, (re.sub(r"(^|\s)#.*", "", line).strip() for line in constraints)):
              requirement = Requirement(line)
              name = canonicalize_name(requirement.name)
              if name not in names or not (requirement.marker is None or requirement.marker.evaluate(environment)):
                  continue
              if name in pins:
                  sys.exit(f"upper-constraints holds two lines for {name} on Python {python}")
              [specifier] = requirement.specifier
              if specifier.operator != "===":
                  sys.exit(f"upper-constraints gives {name} as {specifier}")
              pins[name] = specifier.version
          wheels = {
              name: pins[name] if name in pins else json.loads(fetch(f"https://pypi.org/pypi/{name}/json"))["info"]["version"]
              for name in names
          }

          repos = yaml.safe_load(fetch(KOLLA + "kolla/template/repos.yaml"))
          channels = repos["deb"] | repos["debian"] | repos.get("debian-x86_64", {})
          debs = {}
          for name, (repo, package) in DEBS.items():
              channel = channels[repo]
              base = channel["url"].rstrip("/") + "/"
              if channel["suite"].endswith("/"):
                  index = urllib.parse.urljoin(base, channel["suite"] + "Packages")
              else:
                  index = urllib.parse.urljoin(base, f"dists/{channel['suite']}/{channel['component']}/binary-amd64/Packages")
              versions = []
              for stanza in fetch(index).decode().split("\n\n"):
                  fields = {}
                  for line in stanza.splitlines():
                      if line[:1] not in (" ", "\t"):
                          key, _, value = line.partition(":")
                          fields[key] = value.strip()
                  if fields.get("Package") == package and fields.get("Architecture") in ("amd64", "all"):
                      versions.append(fields["Version"])
              debs[name] = newest(versions)

          tarballs = {}
          for name, entry in TARBALLS.items():
              source = sources[entry]
              location = string.Template(source["location"]).safe_substitute(version=source["version"])
              tag = re.search(r"/releases/download/([^/]+)/", location)
              file = source["location_override"]["ppc64el"].rsplit("/", 1)[1]
              if tag is None or source["version"].removeprefix("v") not in file:
                  sys.exit(f"kolla's {entry} names no release tag or a ppc64el file of another version: {location}, {file}")
              tarballs[name] = {"tag": tag.group(1), "file": file}

          interpreter = tuple(int(part) for part in python.split(".")[:2])

          def needs_source_build(name, version):
              arches = set()
              for upload in json.loads(fetch(f"https://pypi.org/pypi/{name}/{version}/json"))["urls"]:
                  if upload["packagetype"] != "bdist_wheel":
                      continue
                  for tag in parse_wheel_filename(upload["filename"])[3]:
                      if tag.platform.startswith(("manylinux", "linux_")) and tag in set(cpython_tags(interpreter, platforms=[tag.platform])):
                          arches.add(next(arch for arch in ("x86_64", "ppc64le", "") if tag.platform.endswith(arch)))
              return "x86_64" in arches and "ppc64le" not in arches

          source_builds = sorted(name for name, version in wheels.items() if needs_source_build(name, version))

          with open(".github/workflows/publish-ppc64le-deps.yml", encoding="utf-8") as fh:
              jobs = yaml.safe_load(fh)["jobs"]
          recipes = {job: hashlib.sha256(json.dumps(body, sort_keys=True).encode()).hexdigest()[:16] for job, body in jobs.items()}

          versions = [
              *debs.items(),
              *((name, tarball["tag"]) for name, tarball in tarballs.items()),
              *wheels.items(),
              ("rsct", os.environ["RSCT"]),
              ("dynamicrm", os.environ["DRM"]),
              ("opflex", os.environ["OPFLEX"]),
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in (("wheels", wheels), ("debs", debs), ("tarballs", tarballs), ("recipes", recipes), ("versions", versions), ("source_builds", source_builds)):
                  print(f"{key}: {json.dumps(value, indent=1)}")
                  out.write(f"{key}={json.dumps(value, separators=(',', ':'))}\n")
          PY

  build-proxysql:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.debs).proxysql }}
    steps:
      - name: Cache ProxySQL deb
        id: cache
        uses: actions/cache@v5
        with:
          path: proxysql-deb
          key: ${{ github.job }}-${{ env.VERSION }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build ProxySQL for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build --platform linux/ppc64le -t proxysql-build \
            "https://github.com/ProxySQL/docker-images.git#:build-images/build-debian13"
          mkdir -p proxysql-deb
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/proxysql-deb:/output" \
            proxysql-build \
            bash -c '
              set -ex
              VERSION="${{ env.VERSION }}"

              git clone --depth 1 --branch "v${VERSION}" \
                https://github.com/sysown/proxysql.git /build/proxysql
              cd /build/proxysql
              sed -i "/targets += coredumper/d" deps/Makefile
              sed -i "/IDIRS.*COREDUMPER/d" lib/Makefile
              sed -i "/LDIRS.*COREDUMPER/d" src/Makefile
              sed -i "/lcoredumper/d" src/Makefile
              make -j"$(nproc)" GIT_VERSION_BASE="$(git describe --tags --long --abbrev=7)"

              # Package as .deb -- upstream-aligned staging + equivs-build
              ARCH=$(dpkg --print-architecture)
              mkdir -p /build/pkgroot/tmp
              cd /build/pkgroot

              cp /build/proxysql/docker/images/proxysql/deb-compliant/ctl/proxysql.ctl ./
              cp /build/proxysql/docker/images/proxysql/deb-compliant/ctl/copyright ./
              sed -i "s/PKG_VERSION_CURVER/${VERSION}/g" ./proxysql.ctl
              sed -i "s/PKG_ARCH/${ARCH}/g" ./proxysql.ctl
              sed -i "/^PKG_PLUGIN_FILES_PLACEHOLDER$/d" ./proxysql.ctl
              sed -i "s/PKG_YEAR/$(date +%Y)/g" ./copyright

              cp /build/proxysql/src/proxysql ./
              cp -r /build/proxysql/etc ./etc
              cp -r /build/proxysql/tools ./tools
              cp -r /build/proxysql/systemd ./systemd

              DEB_BUILD_OPTIONS=nostrip equivs-build proxysql.ctl
              cp proxysql_*.deb /output/
            '
          ls -la proxysql-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: proxysql-deb
          path: proxysql-deb/*.deb
          retention-days: 5

  build-grpcio:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels).grpcio }}
    steps:
      - name: Cache grpcio wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: grpcio-wheel
          key: ${{ github.job }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Cross-compile grpcio for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p grpcio-wheel
          docker run --rm \
            -v "${{ github.workspace }}/grpcio-wheel:/output" \
            debian:trixie \
            bash -c '
              set -ex
              dpkg --add-architecture ppc64el
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip python3-venv build-essential \
                crossbuild-essential-ppc64el \
                libpython${{ needs.resolve.outputs.python }}-dev:ppc64el

              pip download --no-binary :all: --no-deps grpcio==${{ env.VERSION }}
              tar xzf grpcio-*.tar.gz
              cd grpcio-*/

              sed -i "/#elif defined(__myriad2__)/{N;s/#define OPENSSL_32_BIT/#define OPENSSL_32_BIT\n#elif defined(__PPC64__)\n#define OPENSSL_64_BIT\n#elif defined(__PPC__)\n#define OPENSSL_32_BIT/}" \
                third_party/boringssl-with-bazel/src/include/openssl/target.h

              CC=powerpc64le-linux-gnu-gcc \
              CXX=powerpc64le-linux-gnu-g++ \
              _PYTHON_HOST_PLATFORM=linux-ppc64le \
              _PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata__linux_powerpc64le-linux-gnu \
              pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/output .
            '
          ls -la grpcio-wheel/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: grpcio-wheel
          path: grpcio-wheel/*.whl
          retention-days: 5

  build-crypto-wheels:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      CRYPTOGRAPHY: ${{ fromJSON(needs.resolve.outputs.wheels).cryptography }}
      BCRYPT: ${{ fromJSON(needs.resolve.outputs.wheels).bcrypt }}
    steps:
      - name: Cache Python wheels
        id: cache
        uses: actions/cache@v5
        with:
          path: crypto-wheels
          key: ${{ github.job }}-${{ env.CRYPTOGRAPHY }}-${{ env.BCRYPT }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build cryptography and bcrypt wheels for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p crypto-wheels
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/crypto-wheels:/output" \
            debian:trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip python3-venv build-essential \
                rustc cargo libssl-dev libffi-dev pkg-config
              pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/output \
                cryptography==${{ env.CRYPTOGRAPHY }} \
                bcrypt==${{ env.BCRYPT }}
            '
          ls -la crypto-wheels/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: crypto-wheels
          path: crypto-wheels/*.whl
          retention-days: 5

  build-manylinux-wheel:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pip_name: pyyaml
            pip_pkg: PyYAML
            yum_deps: 'libyaml-devel'
          - pip_name: markupsafe
            pip_pkg: MarkupSafe
            yum_deps: ''
          - pip_name: msgpack
            pip_pkg: msgpack
            yum_deps: ''
          - pip_name: wrapt
            pip_pkg: wrapt
            yum_deps: ''
          - pip_name: psutil
            pip_pkg: psutil
            yum_deps: ''
          - pip_name: pyrsistent
            pip_pkg: pyrsistent
            yum_deps: ''
          - pip_name: netifaces
            pip_pkg: netifaces
            yum_deps: ''
          - pip_name: tornado
            pip_pkg: tornado
            yum_deps: ''
          - pip_name: sysv-ipc
            pip_pkg: sysv_ipc
            yum_deps: ''
          - pip_name: ujson
            pip_pkg: ujson
            yum_deps: ''
          - pip_name: pillow
            pip_pkg: pillow
            yum_deps: 'libjpeg-turbo-devel zlib-devel libtiff-devel freetype-devel lcms2-devel libwebp-devel'
          - pip_name: psycopg2
            pip_pkg: psycopg2
            yum_deps: 'postgresql-devel'
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels)[matrix.pip_name] }}
    steps:
      - name: Cache ${{ matrix.pip_name }} wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: wheel-output
          key: ${{ github.job }}-${{ matrix.pip_name }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ contains(fromJSON(needs.resolve.outputs.source_builds), matrix.pip_name) }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build ${{ matrix.pip_name }} wheel for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p wheel-output
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/wheel-output:/output" \
            quay.io/pypa/manylinux_2_28_ppc64le \
            bash -c '
              set -ex
              if [ -n "${{ matrix.yum_deps }}" ]; then
                yum install -y ${{ matrix.yum_deps }}
              fi
              PYTHON=/opt/python/${{ needs.resolve.outputs.abi }}-${{ needs.resolve.outputs.abi }}/bin/python3
              $PYTHON -m pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/tmp/wheels \
                ${{ contains(fromJSON(needs.resolve.outputs.source_builds), matrix.pip_name) && format('--no-binary {0}', matrix.pip_pkg) || '' }} \
                ${{ matrix.pip_pkg }}==${{ env.VERSION }}
              for whl in /tmp/wheels/*.whl; do
                case "$whl" in
                  *-none-any.whl) cp "$whl" /output/ ;;
                  *) auditwheel repair "$whl" --plat manylinux_2_28_ppc64le --wheel-dir=/output ;;
                esac
              done
            '
          ls -la wheel-output/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.pip_name }}-wheel
          path: wheel-output/*.whl
          retention-days: 5

  build-pynacl-wheel:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels).pynacl }}
    steps:
      - name: Cache PyNaCl wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: pynacl-wheel
          key: ${{ github.job }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Cross-compile PyNaCl for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p pynacl-wheel
          docker run --rm \
            -v "${{ github.workspace }}/pynacl-wheel:/output" \
            debian:trixie \
            bash -c '
              set -ex
              dpkg --add-architecture ppc64el
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip python3-venv build-essential \
                crossbuild-essential-ppc64el \
                autoconf automake libtool \
                libpython${{ needs.resolve.outputs.python }}-dev:ppc64el libffi-dev libffi-dev:ppc64el

              python3 -m venv /tmp/bv
              /tmp/bv/bin/pip install --no-cache-dir cffi setuptools wheel

              /tmp/bv/bin/pip download --no-binary :all: --no-deps \
                "PyNaCl==${{ env.VERSION }}"
              # PEP 625 normalises sdist names to lowercase (PyNaCl 1.6.2 ->
              # pynacl-1.6.2.tar.gz), so match case-insensitively.
              tar xzf [Pp]y[Nn]a[Cc][Ll]-*.tar.gz
              cd [Pp]y[Nn]a[Cc][Ll]-*/

              # Phase 1: Cross-compile bundled libsodium with proper --host
              cd src/libsodium
              # PyNaCl 1.6.x bundles a libsodium tree without the generated
              # autotools helper scripts (compile/depcomp/install-sh/missing),
              # so regenerate the build system instead of chmod-ing them.
              autoreconf -fi
              ./configure \
                --host=powerpc64le-linux-gnu \
                --disable-shared --enable-static \
                --disable-debug --disable-dependency-tracking \
                --with-pic \
                --prefix=/tmp/libsodium-ppc64le
              make -j"$(nproc)"
              make install
              cd ../..

              # Phase 2: Build PyNaCl against pre-built libsodium
              SODIUM_INSTALL=system \
              CFLAGS="-I/tmp/libsodium-ppc64le/include" \
              LDFLAGS="-L/tmp/libsodium-ppc64le/lib" \
              CC=powerpc64le-linux-gnu-gcc \
              _PYTHON_HOST_PLATFORM=linux-ppc64le \
              _PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata__linux_powerpc64le-linux-gnu \
              /tmp/bv/bin/pip wheel --no-cache-dir --no-deps --no-build-isolation \
                --wheel-dir=/output .
            '
          ls -la pynacl-wheel/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pynacl-wheel
          path: pynacl-wheel/*.whl
          retention-days: 5

  build-uwsgi-proton-wheels:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      UWSGI: ${{ fromJSON(needs.resolve.outputs.wheels).uwsgi }}
      PROTON: ${{ fromJSON(needs.resolve.outputs.wheels)['python-qpid-proton'] }}
    steps:
      - name: Cache uwsgi and proton wheels
        id: cache
        uses: actions/cache@v5
        with:
          path: uwsgi-proton-wheels
          key: ${{ github.job }}-${{ env.UWSGI }}-${{ env.PROTON }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Set up QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Build uwsgi and python-qpid-proton wheels for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p uwsgi-proton-wheels
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}/uwsgi-proton-wheels:/output" \
            debian:trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip build-essential pkg-config \
                libpcre2-dev libssl-dev libcap-dev libyaml-dev libjansson-dev \
                cmake swig libqpid-proton11-dev
              pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/output \
                uwsgi==${{ env.UWSGI }} \
                python-qpid-proton==${{ env.PROTON }}
            '
          ls -la uwsgi-proton-wheels/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: uwsgi-proton-wheels
          path: uwsgi-proton-wheels/*.whl
          retention-days: 5

  build-py-radix-wheel:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels)['py-radix'] }}
    steps:
      - name: Cache py-radix wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: py-radix-wheel
          key: ${{ github.job }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Cross-compile py-radix for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p py-radix-wheel
          docker run --rm \
            -e VERSION="v${VERSION}" \
            -v "${{ github.workspace }}/py-radix-wheel:/output" \
            debian:trixie \
            bash -c '
              set -ex
              dpkg --add-architecture ppc64el
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip build-essential \
                crossbuild-essential-ppc64el \
                libpython${{ needs.resolve.outputs.python }}-dev:ppc64el

              python3 -c "import json,urllib.request;d=json.loads(urllib.request.urlopen(\"https://pypi.org/pypi/py-radix/${{ env.VERSION }}/json\").read());s=next(u for u in d[\"urls\"] if u[\"packagetype\"]==\"sdist\");urllib.request.urlretrieve(s[\"url\"],\"/tmp/\"+s[\"filename\"])"
              tar xzf /tmp/py_radix-*.tar.gz -C /tmp/
              cd /tmp/py_radix-*/

              CC=powerpc64le-linux-gnu-gcc \
              CFLAGS="-Wno-error=incompatible-pointer-types" \
              _PYTHON_HOST_PLATFORM=linux-ppc64le \
              _PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata__linux_powerpc64le-linux-gnu \
              pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/output .
            '
          ls -la py-radix-wheel/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: py-radix-wheel
          path: py-radix-wheel/*.whl
          retention-days: 5

  build-cross-compiled-wheels:
    needs: resolve
    if: inputs.track == 'pages'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pip_name: libsass
            pip_pkg: libsass
            apt_deps: ''
            extra_env: ''
          - pip_name: zstd
            pip_pkg: zstd
            apt_deps: ''
            extra_env: ''
          - pip_name: lz4
            pip_pkg: lz4
            apt_deps: ''
            extra_env: ''
          - pip_name: ruamel-yaml-clib
            pip_pkg: ruamel.yaml.clib
            apt_deps: ''
            extra_env: ''
          - pip_name: yappi
            pip_pkg: yappi
            apt_deps: ''
            extra_env: ''
          - pip_name: python-ldap
            pip_pkg: python-ldap
            apt_deps: 'libldap2-dev:ppc64el libsasl2-dev:ppc64el'
            extra_env: ''
          - pip_name: scrypt
            pip_pkg: scrypt
            apt_deps: 'libssl-dev:ppc64el'
            extra_env: ''
          - pip_name: rcssmin
            pip_pkg: rcssmin
            apt_deps: ''
            extra_env: ''
          - pip_name: rjsmin
            pip_pkg: rjsmin
            apt_deps: ''
            extra_env: ''
          - pip_name: immutables
            pip_pkg: immutables
            apt_deps: ''
            extra_env: ''
          - pip_name: zeroconf
            pip_pkg: zeroconf
            apt_deps: ''
            extra_env: ''
          - pip_name: gssapi
            pip_pkg: gssapi
            apt_deps: 'libkrb5-dev:ppc64el'
            extra_env: 'GSSAPI_SUPPORT_DETECT=false GSSAPI_COMPILER_ARGS="-I/usr/include" GSSAPI_LINKER_ARGS="-L/usr/lib/powerpc64le-linux-gnu -lgssapi_krb5"'
          - pip_name: krb5
            pip_pkg: krb5
            apt_deps: 'libkrb5-dev:ppc64el libkrb5-3'
            extra_env: 'KRB5_MAIN_LIB=/usr/lib/x86_64-linux-gnu/libkrb5.so.3 KRB5_COMPILER_ARGS="-I/usr/include" KRB5_LINKER_ARGS="-L/usr/lib/powerpc64le-linux-gnu -lkrb5 -lk5crypto -lcom_err"'
    env:
      VERSION: ${{ fromJSON(needs.resolve.outputs.wheels)[matrix.pip_name] }}
    steps:
      - name: Cache ${{ matrix.pip_name }} wheel
        id: cache
        uses: actions/cache@v5
        with:
          path: wheel-output
          key: ${{ github.job }}-${{ matrix.pip_name }}-${{ env.VERSION }}-${{ needs.resolve.outputs.abi }}-${{ fromJSON(needs.resolve.outputs.recipes)[github.job] }}

      - name: Cross-compile ${{ matrix.pip_name }} for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p wheel-output
          docker run --rm \
            -v "${{ github.workspace }}/wheel-output:/output" \
            debian:trixie \
            bash -c '
              set -ex
              dpkg --add-architecture ppc64el
              apt-get update && apt-get install -y --no-install-recommends \
                python3-dev python3-pip python3-venv build-essential \
                crossbuild-essential-ppc64el \
                libpython${{ needs.resolve.outputs.python }}-dev:ppc64el ${{ matrix.apt_deps }}

              ${{ matrix.extra_env }} \
              CC=powerpc64le-linux-gnu-gcc \
              CXX=powerpc64le-linux-gnu-g++ \
              _PYTHON_HOST_PLATFORM=linux-ppc64le \
              _PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata__linux_powerpc64le-linux-gnu \
              pip wheel --no-cache-dir --no-deps \
                --wheel-dir=/output \
                ${{ matrix.pip_pkg }}==${{ env.VERSION }}
            '
          ls -la wheel-output/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.pip_name }}-wheel
          path: wheel-output/*.whl
          retention-days: 5

