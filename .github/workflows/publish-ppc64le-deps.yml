  build-tempo:
    if: inputs.track == 'tempo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Tempo version
        id: resolve
        uses: ./.github/actions/upstream-release
        with:
          repository: grafana/tempo
          version: ${{ inputs.version }}

      - name: Clone and patch Tempo
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git clone --depth 1 --branch "v$VERSION" https://github.com/grafana/tempo.git tempo
          git -C tempo apply "$GITHUB_WORKSPACE/images/tempo/live-store-ring-address.patch"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tempo/go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Tempo
        working-directory: tempo
        env:
          IMAGE: ghcr.io/${{ github.repository }}/tempo:${{ steps.resolve.outputs.version }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          COMPONENT=tempo GOARCH=amd64 make exe
          docker build --provenance false --platform linux/amd64 -f cmd/tempo/Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE" -t "$IMAGE" .
          docker push "$IMAGE"

  resolve-trove-backup-postgresql:
    if: inputs.track == 'trove-backup-postgresql'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      majors: ${{ steps.majors.outputs.majors }}
      trove_url: ${{ steps.trove.outputs.url }}
      trove_sha256: ${{ steps.trove.outputs.sha256 }}
      requirements_url: ${{ steps.requirements.outputs.url }}
      requirements_sha256: ${{ steps.requirements.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Trove as kolla installs it
        id: trove
        uses: ./.github/actions/kolla-source
        with:
          kolla: 77997/kolla
          kolla-branch: stable/2026.1
          source: trove-base

      - name: Resolve the requirements kolla installs with
        id: requirements
        uses: ./.github/actions/kolla-source
        with:
          kolla: 77997/kolla
          kolla-branch: stable/2026.1
          source: openstack-base

      - name: Resolve the PostgreSQL majors
        id: majors
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import json
          import os
          import re
          import sys
          import urllib.request


          def fetch(url):
              with urllib.request.urlopen(url, timeout=120) as response:
                  return response.read()


          def clients(arch):
              packages = gzip.decompress(fetch(f"https://apt.postgresql.org/pub/repos/apt/dists/trixie-pgdg/main/binary-{arch}/Packages.gz")).decode()
              return set(re.findall(r"^Package: postgresql-client-(\d+)$", packages, re.M))


          def published(major):
              # Whether Docker Hub's postgres:<major>, the image Trove's guests run, holds both architectures
              token = json.loads(fetch("https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull"))["token"]
              request = urllib.request.Request(f"https://registry-1.docker.io/v2/library/postgres/manifests/{major}", headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json",
              })
              with urllib.request.urlopen(request, timeout=120) as response:
                  index = json.load(response)
              return {"amd64", "ppc64le"} <= {m["platform"]["architecture"] for m in index.get("manifests", [])}


          # The newest major the official postgres image maintains and has published for both
          # architectures, for which the PostgreSQL project publishes a trixie client on both,
          # or the one the version input names; the images of older majors stay as published
          maintained = {major for major in json.loads(fetch("https://raw.githubusercontent.com/docker-library/postgres/master/versions.json")) if major.isdigit()}
          available = sorted(maintained & clients("amd64") & clients("ppc64el"), key=int)
          usable = [major for major in available if published(major)]
          if not usable:
              sys.exit(f"Docker Hub's postgres publishes none of {available} for both architectures")
          version = os.environ["VERSION"]
          if version and version not in usable:
              sys.exit(f"PostgreSQL {version} is not one of {usable}")
          majors = [version or usable[-1]]
          print(f"Resolved PostgreSQL majors {majors}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"majors={json.dumps(majors)}\n")
          PY

  build-trove-backup-postgresql:
    needs: resolve-trove-backup-postgresql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJson(needs.resolve-trove-backup-postgresql.outputs.majors) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch Trove's backup directory and kolla's upper-constraints
        env:
          TROVE_URL: ${{ needs.resolve-trove-backup-postgresql.outputs.trove_url }}
          TROVE_SHA256: ${{ needs.resolve-trove-backup-postgresql.outputs.trove_sha256 }}
          REQUIREMENTS_URL: ${{ needs.resolve-trove-backup-postgresql.outputs.requirements_url }}
          REQUIREMENTS_SHA256: ${{ needs.resolve-trove-backup-postgresql.outputs.requirements_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trove.tar.gz" "$TROVE_URL"
          echo "$TROVE_SHA256  $RUNNER_TEMP/trove.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/trove"
          tar -xzf "$RUNNER_TEMP/trove.tar.gz" -C "$RUNNER_TEMP/trove" --strip-components 1
          test -f "$RUNNER_TEMP/trove/backup/requirements.txt"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/requirements.tar.gz" "$REQUIREMENTS_URL"
          echo "$REQUIREMENTS_SHA256  $RUNNER_TEMP/requirements.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/requirements" "$RUNNER_TEMP/constraints"
          tar -xzf "$RUNNER_TEMP/requirements.tar.gz" -C "$RUNNER_TEMP/requirements" --strip-components 1
          cp "$RUNNER_TEMP/requirements/upper-constraints.txt" "$RUNNER_TEMP/constraints/"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the PostgreSQL ${{ matrix.major }} backup image
        env:
          MAJOR: ${{ matrix.major }}
          IMAGE: ghcr.io/${{ github.repository }}/trove-backup-postgresql
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/amd64,linux/ppc64le \
            --build-arg PG_MAJOR="$MAJOR" \
            --build-context constraints="$RUNNER_TEMP/constraints" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --file images/trove-backup-postgresql/Dockerfile \
            --tag "$IMAGE:$MAJOR" \
            --push "$RUNNER_TEMP/trove/backup"

  resolve-trove-guest:
    if: inputs.track == 'trove-guest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trove_url: ${{ steps.trove.outputs.url }}
      trove_sha256: ${{ steps.trove.outputs.sha256 }}
      requirements_url: ${{ steps.requirements.outputs.url }}
      requirements_sha256: ${{ steps.requirements.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Trove as kolla installs it
        id: trove
        uses: ./.github/actions/kolla-source
        with:
          kolla: 77997/kolla
          kolla-branch: stable/2026.1
          source: trove-base

      - name: Resolve the requirements kolla installs with
        id: requirements
        uses: ./.github/actions/kolla-source
        with:
          kolla: 77997/kolla
          kolla-branch: stable/2026.1
          source: openstack-base

  build-trove-guest:
    needs: resolve-trove-guest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, ppc64le]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: matrix.arch == 'ppc64le'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Install the disk tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils cloud-guest-utils

      - name: Build the ${{ matrix.arch }} disk
        env:
          ARCH: ${{ matrix.arch }}
          TROVE_URL: ${{ needs.resolve-trove-guest.outputs.trove_url }}
          TROVE_SHA256: ${{ needs.resolve-trove-guest.outputs.trove_sha256 }}
          REQUIREMENTS_URL: ${{ needs.resolve-trove-guest.outputs.requirements_url }}
          REQUIREMENTS_SHA256: ${{ needs.resolve-trove-guest.outputs.requirements_sha256 }}
          OUT: ${{ github.workspace }}/disk
        run: |
          sudo --preserve-env=ARCH,TROVE_URL,TROVE_SHA256,REQUIREMENTS_URL,REQUIREMENTS_SHA256,OUT \
            images/trove-guest/build.sh

      - name: Upload the disk
        uses: actions/upload-artifact@v6
        with:
          name: trove-guest-${{ matrix.arch }}
          path: disk/
          compression-level: 0
          retention-days: 5

  release-trove-guest:
    needs: [resolve-trove-guest, build-trove-guest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the disks
        uses: actions/download-artifact@v7
        with:
          path: disks
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TROVE_URL: ${{ needs.resolve-trove-guest.outputs.trove_url }}
          TROVE_SHA256: ${{ needs.resolve-trove-guest.outputs.trove_sha256 }}
          REQUIREMENTS_URL: ${{ needs.resolve-trove-guest.outputs.requirements_url }}
          REQUIREMENTS_SHA256: ${{ needs.resolve-trove-guest.outputs.requirements_sha256 }}
        run: |
          set -euo pipefail
          TAG="trove-guest/$(TZ=America/St_Johns date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          BODY="Trove from $TROVE_URL (sha256 $TROVE_SHA256), installed with the upper-constraints of $REQUIREMENTS_URL (sha256 $REQUIREMENTS_SHA256)."
          for versions in disks/*.versions; do
            BODY+=$'\n\n'"$(basename "$versions" .versions): $(paste -sd, "$versions" | sed 's/,/, /g')"
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Trove guest disks $(TZ=America/St_Johns date '+%b %-d, %Y (%Z)')" \
            --notes "$BODY" \
            disks/*.qcow2 disks/*.qcow2.sha256

  build-zuul:
    if: inputs.track == 'zuul'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the Zuul release and the image revision, and resolve the index's Python
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . images/zuul/release.env
          # The revision counts changes to the images of one release, so the track builds the release it names.
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$ZUUL_VERSION" ]; then
            echo "release.env pins Zuul $ZUUL_VERSION, not $REQUESTED"; exit 1
          fi
          VERSION="$ZUUL_VERSION"
          PYTHON="$(docker run --rm debian:trixie bash -c 'apt-get update -qq && apt-cache show --no-all-versions python3' \
            | sed -nE 's/^Version: ([0-9]+\.[0-9]+)\..*/\1/p')"
          [ -n "$PYTHON" ] || { echo "Python version resolution failed"; exit 1; }
          echo "Building Zuul $VERSION on Python $PYTHON, image revision $REVISION"
          { echo "version=$VERSION"; echo "revision=$REVISION"; echo "python=$PYTHON"; } >> "$GITHUB_OUTPUT"

      - name: Clone and patch Zuul, OpenDev's Python base images and the index's constraints
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PYTHON: ${{ steps.resolve.outputs.python }}
        run: |
          set -euo pipefail
          git -c advice.detachedHead=false clone --depth 1 --branch "$VERSION" https://opendev.org/zuul/zuul.git zuul
          git -C zuul apply "$GITHUB_WORKSPACE/images/zuul/ppc64le.patch"
          git clone --depth 1 --filter=blob:none --sparse https://opendev.org/opendev/system-config.git system-config
          git -C system-config sparse-checkout set docker/python-base docker/python-builder
          OCP="$(sed -nE 's#^ARG OPENSHIFT_URL=.*/clients/ocp/([^/]+)/.*#\1#p' zuul/Dockerfile)"
          [ -n "$OCP" ] || { echo "Zuul's Dockerfile names no OpenShift client version"; exit 1; }
          SHA="$(curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/ppc64le/clients/ocp/$OCP/sha256sum.txt" \
            | awk -v file="openshift-client-linux-$OCP.tar.gz" '$2 == file {print $1}')"
          [ ${#SHA} -eq 64 ] || { echo "No checksum for the ppc64le OpenShift client $OCP"; exit 1; }
          {
            echo "OPENSHIFT_URL=https://mirror.openshift.com/pub/openshift-v4/ppc64le/clients/ocp/$OCP/openshift-client-linux-$OCP.tar.gz"
            echo "OPENSHIFT_SHA=$SHA"
          } >> "$GITHUB_ENV"
          mkdir -p zuul/ppc64le
          cp images/zuul/check-environments.py zuul/ppc64le/
          python3 - "$PYTHON" > zuul/ppc64le/constraints.txt <<'PY'
          import re
          import sys
          import urllib.request

          abi = "cp" + sys.argv[1].replace(".", "")
          index = "https://77997.github.io/images-ppc64le/simple/"

          def held(project):
              page = urllib.request.urlopen(index + project + "/", timeout=60).read().decode()
              versions = set()
              for name in re.findall(r">([^<]+\.whl)<", page):
                  parts = name[:-4].split("-")
                  if parts[2] == abi or parts[3] == "abi3":
                      versions.add(parts[1])
              if len(versions) != 1:
                  sys.exit(f"The index holds {sorted(versions) or 'no'} {project} wheels for {abi}")
              return versions.pop()

          grpcio = held("grpcio")
          # The compiled packages Zuul and its Ansible environments share with the index, at the versions it holds;
          # grpcio-status releases with grpcio.
          print(f"grpcio=={grpcio}")
          print(f"grpcio-status=={grpcio}")
          print(f"confluent-kafka=={held('confluent-kafka')}")
          print(f"google-re2=={held('google-re2')}")
          print(f"google-crc32c=={held('google-crc32c')}")
          PY
          cat zuul/ppc64le/constraints.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Zuul's scheduler, executor, web and launcher
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          REVISION: ${{ steps.resolve.outputs.revision }}
          PYTHON_VERSION: ${{ steps.resolve.outputs.python }}
          REGISTRY: ghcr.io/${{ github.repository }}
          SOURCE: https://github.com/${{ github.repository }}
        run: docker buildx bake -f images/zuul/docker-bake.hcl --push

  build-gerrit:
    if: inputs.track == 'gerrit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the Gerrit release and the image revision, and the release's published checksum
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . images/gerrit/release.env
          # The SAML plugin is pinned for one Gerrit release, so the track builds that release and no other.
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$GERRIT_VERSION" ]; then
            echo "release.env pins Gerrit $GERRIT_VERSION, not $REQUESTED"; exit 1
          fi
          MD5="$(curl -fsSI "https://gerrit-releases.storage.googleapis.com/gerrit-$GERRIT_VERSION.war" \
            | sed -nE 's/^x-goog-hash: md5=([A-Za-z0-9+/=]+).*/\1/Ip' | base64 -d | od -An -tx1 | tr -d ' \n')"
          [ ${#MD5} -eq 32 ] || { echo "No MD5 published for gerrit-$GERRIT_VERSION.war"; exit 1; }
          echo "Building Gerrit $GERRIT_VERSION with the SAML plugin at $SAML_COMMIT, image revision $REVISION"
          { echo "version=$GERRIT_VERSION"; echo "revision=$REVISION"; echo "md5=$MD5"; } >> "$GITHUB_OUTPUT"

      - name: Build the SAML plugin
        timeout-minutes: 60
        run: images/gerrit/build-saml-plugin.sh images/gerrit/saml.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Gerrit
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          MD5: ${{ steps.resolve.outputs.md5 }}
          IMAGE: ghcr.io/${{ github.repository }}/gerrit:${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.revision }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/amd64,linux/ppc64le \
            --build-arg GERRIT_VERSION="$VERSION" --build-arg GERRIT_MD5="$MD5" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE" \
            --push images/gerrit

  build-ejbca:
    if: inputs.track == 'ejbca'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the EJBCA release, its pinned downloads and the image revision
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . images/ejbca/release.env
          # The configuration and the WildFly recipe are written for one EJBCA release, so the track builds that
          # release and no other.
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$EJBCA_VERSION" ]; then
            echo "release.env pins EJBCA $EJBCA_VERSION, not $REQUESTED"; exit 1
          fi
          for name in EJBCA_VERSION REVISION EJBCA_SOURCE_URL EJBCA_SOURCE_SHA256 WILDFLY_VERSION WILDFLY_URL \
                      WILDFLY_SHA256 POSTGRESQL_JDBC_VERSION POSTGRESQL_JDBC_URL POSTGRESQL_JDBC_SHA256; do
            [ -n "${!name:-}" ] || { echo "images/ejbca/release.env does not set $name"; exit 1; }
          done
          echo "Building EJBCA $EJBCA_VERSION on WildFly $WILDFLY_VERSION, image revision $REVISION"
          {
            echo "version=$EJBCA_VERSION"
            echo "revision=$REVISION"
            echo "ejbca_source_url=$EJBCA_SOURCE_URL"
            echo "ejbca_source_sha256=$EJBCA_SOURCE_SHA256"
            echo "wildfly_version=$WILDFLY_VERSION"
            echo "wildfly_url=$WILDFLY_URL"
            echo "wildfly_sha256=$WILDFLY_SHA256"
            echo "postgresql_jdbc_url=$POSTGRESQL_JDBC_URL"
            echo "postgresql_jdbc_sha256=$POSTGRESQL_JDBC_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push EJBCA
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          EJBCA_SOURCE_URL: ${{ steps.resolve.outputs.ejbca_source_url }}
          EJBCA_SOURCE_SHA256: ${{ steps.resolve.outputs.ejbca_source_sha256 }}
          WILDFLY_VERSION: ${{ steps.resolve.outputs.wildfly_version }}
          WILDFLY_URL: ${{ steps.resolve.outputs.wildfly_url }}
          WILDFLY_SHA256: ${{ steps.resolve.outputs.wildfly_sha256 }}
          POSTGRESQL_JDBC_URL: ${{ steps.resolve.outputs.postgresql_jdbc_url }}
          POSTGRESQL_JDBC_SHA256: ${{ steps.resolve.outputs.postgresql_jdbc_sha256 }}
          IMAGE: ghcr.io/${{ github.repository }}/ejbca:${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.revision }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/amd64,linux/ppc64le \
            --build-arg EJBCA_VERSION="$VERSION" \
            --build-arg EJBCA_SOURCE_URL="$EJBCA_SOURCE_URL" --build-arg EJBCA_SOURCE_SHA256="$EJBCA_SOURCE_SHA256" \
            --build-arg WILDFLY_VERSION="$WILDFLY_VERSION" \
            --build-arg WILDFLY_URL="$WILDFLY_URL" --build-arg WILDFLY_SHA256="$WILDFLY_SHA256" \
            --build-arg POSTGRESQL_JDBC_URL="$POSTGRESQL_JDBC_URL" --build-arg POSTGRESQL_JDBC_SHA256="$POSTGRESQL_JDBC_SHA256" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE" \
            --push images/ejbca

  build-keycloak:
    if: inputs.track == 'keycloak'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the Keycloak release, its pinned download and the image revision
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . images/keycloak/release.env
          # The build-time options are chosen for one Keycloak release, so the track builds that release and no
          # other.
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$KEYCLOAK_VERSION" ]; then
            echo "release.env pins Keycloak $KEYCLOAK_VERSION, not $REQUESTED"; exit 1
          fi
          for name in KEYCLOAK_VERSION REVISION KEYCLOAK_URL KEYCLOAK_SHA256; do
            [ -n "${!name:-}" ] || { echo "images/keycloak/release.env does not set $name"; exit 1; }
          done
          echo "Building Keycloak $KEYCLOAK_VERSION, image revision $REVISION"
          {
            echo "version=$KEYCLOAK_VERSION"
            echo "revision=$REVISION"
            echo "keycloak_url=$KEYCLOAK_URL"
            echo "keycloak_sha256=$KEYCLOAK_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Keycloak
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          KEYCLOAK_URL: ${{ steps.resolve.outputs.keycloak_url }}
          KEYCLOAK_SHA256: ${{ steps.resolve.outputs.keycloak_sha256 }}
          IMAGE: ghcr.io/${{ github.repository }}/keycloak:${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.revision }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/amd64,linux/ppc64le \
            --build-arg KEYCLOAK_VERSION="$VERSION" \
            --build-arg KEYCLOAK_URL="$KEYCLOAK_URL" --build-arg KEYCLOAK_SHA256="$KEYCLOAK_SHA256" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE" \
            --push images/keycloak

  build-zookeeper:
    if: inputs.track == 'zookeeper'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Debian's ZooKeeper
        id: resolve
        run: |
          set -euo pipefail
          VERSION="$(docker run --rm debian:trixie bash -c 'apt-get update -qq && apt-cache show --no-all-versions zookeeper' \
            | sed -nE 's/^Version: (.+)/\1/p' | tr '+~' '--')"
          [ -n "$VERSION" ] || { echo "ZooKeeper version resolution failed"; exit 1; }
          echo "Resolved ZooKeeper $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ZooKeeper
        env:
          IMAGE: ghcr.io/${{ github.repository }}/zookeeper:${{ steps.resolve.outputs.version }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform linux/amd64,linux/ppc64le \
            --label "org.opencontainers.image.source=$SOURCE" \
            --tag "$IMAGE" \
            --push images/zookeeper

  build-openstackclient:
    if: inputs.track == 'openstackclient'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Debian's OpenStack client and its plugins
        id: resolve
        run: |
          set -euo pipefail
          # The tag is the client's version; the two plugins' versions go on the image as labels.
          version() {
            docker run --rm debian:trixie bash -c "apt-get update -qq && apt-cache show --no-all-versions $1" \
              | sed -nE 's/^Version: (.+)/\1/p' | tr '+~' '--'
          }
          VERSION="$(version python3-openstackclient)"
          TROVE="$(version python3-troveclient)"
          BARBICAN="$(version python3-barbicanclient)"
          [ -n "$VERSION" ] && [ -n "$TROVE" ] && [ -n "$BARBICAN" ] || { echo "OpenStack client version resolution failed"; exit 1; }
          echo "Resolved python3-openstackclient $VERSION, python3-troveclient $TROVE, python3-barbicanclient $BARBICAN"
          {
            echo "version=$VERSION"
            echo "trove=$TROVE"
            echo "barbican=$BARBICAN"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64,linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the OpenStack client
        env:
          IMAGE: ghcr.io/${{ github.repository }}/openstackclient:${{ steps.resolve.outputs.version }}
          SOURCE: https://github.com/${{ github.repository }}
          TROVE: ${{ steps.resolve.outputs.trove }}
          BARBICAN: ${{ steps.resolve.outputs.barbican }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64,linux/ppc64le \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "net.as30265.python3-troveclient=$TROVE" \
            --label "net.as30265.python3-barbicanclient=$BARBICAN" \
            --tag "$IMAGE" \
            --push images/openstackclient
