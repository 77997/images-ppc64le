                libpython${{ needs.resolve.outputs.python }}-dev:ppc64el \
                libpython${{ needs.resolve.outputs.python }}-stdlib:ppc64el \
                curl pkg-config

              cp /usr/lib/python${{ needs.resolve.outputs.python }}/_sysconfigdata__linux_powerpc64le-linux-gnu.py \
