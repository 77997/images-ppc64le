name: Upstream release
description: The version to build, or the highest release of a GitHub repository
inputs:
  repository:
    description: GitHub repository, as influxdata/telegraf
    required: true
  version:
    description: Version to build, as 1.40.2 (empty = highest release)
outputs:
  version:
    description: The version to build
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$VERSION" ]; then
          VERSION="$(gh api --paginate "repos/$REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -1)"
          VERSION="${VERSION#v}"
        fi
        [ -n "$VERSION" ] || { echo "$REPOSITORY version resolution failed"; exit 1; }
        echo "Resolved $REPOSITORY $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
