# The settings of the EJBCA this image replaces, so the restored database reads as it did there.
# password.encryption.key and ca.keystorepass stay unset on purpose: the database was written with their defaults,
# and the soft crypto tokens' auto-activation PINs only decrypt with the same key.

certificate.validityoffset=-10m

# Copied into the database by the upgrade from 9.3, which moved it there; it stays here so that copy happens.
database.crlgenfetchordered=true

securityeventsaudit.implementation.0=org.cesecore.audit.impl.log4j.Log4jDevice
securityeventsaudit.implementation.1=org.cesecore.audit.impl.integrityprotected.IntegrityProtectedDevice
securityeventsaudit.exporter.1=org.cesecore.audit.impl.AuditExporterXml
