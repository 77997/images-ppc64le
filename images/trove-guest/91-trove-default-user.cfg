# The guest user is cloud-init's default user, as Trove's "ubuntu" guest user is on Ubuntu's
# images: cloud-init then creates no second account at first boot, so the instance's key pair
# reaches this user and the UID Trove gives its database service user (1001) stays free.
system_info:
  default_user:
    name: trove
    lock_passwd: true
    gecos: Trove guest
    groups: [sudo, docker]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
